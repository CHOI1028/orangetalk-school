<!-- 키오스크 기본형 세로 HTML 템플릿 — buildKioskHtml() 출력 기준 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OO학교 보건실 키오스크</title>
<style>
/* ══════════ 리셋 + 기본 ══════════ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:"Pretendard",-apple-system,"Noto Sans KR",sans-serif;position:relative;background:#0f172a}
body::after{content:"";position:fixed;inset:0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(245,247,250,0.35);z-index:1}
.bg-image{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity 1.5s ease;z-index:-1}
/* 배경 레이어: 그라디언트(맨 아래) → 이미지(중간) → body::after 블러(맨 위) */
.bg-gradient{position:fixed;inset:0;z-index:-2;background:linear-gradient(135deg,#667eea 0%,#764ba2 25%,#f093fb 50%,#4facfe 75%,#00f2fe 100%);background-size:400% 400%;animation:gradientShift 20s ease infinite}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ══════════ 탑바 (글래스모피즘) ══════════ */
.top-bar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:linear-gradient(135deg,rgba(8,145,178,0.55),rgba(6,182,212,0.45),rgba(14,116,144,0.5),rgba(8,145,178,0.55),rgba(6,182,212,0.45));background-size:300% 100%;animation:headerGrad 15s ease infinite;backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 1px 0 rgba(255,255,255,0.15) inset,0 4px 16px rgba(0,0,0,0.08);border-bottom:0.5px solid rgba(255,255,255,0.18)}
@keyframes headerGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.tb-school{font-size:17px;font-weight:800;color:#fff;display:flex;align-items:center;gap:10px;text-shadow:0 1px 4px rgba(0,0,0,0.1)}
.tb-school span:first-child{font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.15))}
.tb-right{display:flex;align-items:center;gap:12px}
.queue-badge{font-size:13px;font-weight:700;color:#fff;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.25);border-radius:20px;padding:5px 18px;backdrop-filter:blur(4px)}

/* ══════════ 세로형 전체 레이아웃 ══════════ */
.kiosk-portrait{position:relative;z-index:10;width:100%;height:100vh;padding-top:56px;display:flex;align-items:center;justify-content:center}
.kiosk-portrait-inner{width:100%;max-width:600px;padding:16px 20px}

/* ══════════ 스크린 (스크롤 금지!) ══════════ */
.screen{display:none;width:100%;max-width:600px;text-align:center;animation:fadeIn .3s ease;height:100%;flex-direction:column;justify-content:center;padding:0}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
h2{font-size:clamp(22px,3.2vw,32px);font-weight:800;color:#1e293b;margin-bottom:20px;flex-shrink:0}

/* ══════════ 버튼 — 세로 자동 축소 ══════════ */
.btn-list{display:flex;flex-direction:column;gap:8px;min-height:0}
.main-btn{display:flex;align-items:center;gap:14px;width:100%;padding:clamp(12px,2vh,24px) clamp(16px,2vw,28px);border:1.5px solid #d1d9e0;border-radius:16px;background:#ffffff;font-size:clamp(14px,1.6vw,19px);font-weight:700;color:#1e293b;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,0.04);flex-shrink:1;min-height:0;overflow:hidden}
.main-btn:hover{border-color:#06b6d4;background:#f0fdfa;transform:translateY(-1px);box-shadow:0 4px 16px rgba(8,145,178,0.1)}
.main-btn:active{transform:scale(0.98)}
.main-btn.selected{border-color:#0891b2;background:#e0f7fa;color:#065f78;box-shadow:0 0 0 2px rgba(6,182,212,0.25) inset,0 4px 16px rgba(6,182,212,0.12)}
.btn-emoji{font-size:clamp(24px,2.8vw,36px);flex-shrink:0}
.back-btn,.confirm-btn{padding:10px 28px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;min-width:100px;text-align:center;flex-shrink:0}
.confirm-btn{margin-top:10px;border:none;background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;box-shadow:0 4px 16px rgba(6,182,212,0.3)}
.confirm-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(6,182,212,0.4)}
.confirm-btn:disabled{opacity:0.4;cursor:default;transform:none}
.back-btn{margin-top:8px;border:2px solid #e2a3c0;background:#fdf2f8;color:#9d174d;font-size:13px;padding:10px 28px;font-weight:700}
.back-btn:hover{background:#fce7f3;border-color:#ec4899}

/* ══════════ 인적사항 드릴다운 ══════════ */
.personal-drill{max-width:600px;margin:0 auto;width:100%;min-height:0;display:flex;flex-direction:column}
.drill-tab{padding:10px 24px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;color:#64748b;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.drill-tab.active{border-color:#06b6d4;background:#e0f7fa;color:#0891b2}
.drill-tab:hover{border-color:#06b6d4}
.drill-grade-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.drill-grade-btn{padding:14px 26px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;color:#334155;font-size:18px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.drill-grade-btn:hover{border-color:#06b6d4;background:#f0fdfa;color:#0891b2}
.drill-grade-btn.active{border-color:#06b6d4;background:#e0f7fa;color:#0891b2;box-shadow:0 0 0 2px rgba(6,182,212,0.15) inset}
.drill-cls-panel{border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 12px;background:#ffffff;cursor:pointer;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.drill-cls-panel:hover{border-color:#06b6d4;background:#f0fdfa}
.drill-cls-title{font-size:12px;font-weight:700;color:#0891b2;margin-bottom:6px}
.drill-chip{padding:3px 8px;border:1px solid #e2e8f0;border-radius:5px;background:#fff;font-size:10px;font-weight:600;color:#334155;display:inline-block}
.drill-sel-chip{padding:10px 18px;border:2px solid #e2e8f0;border-radius:10px;background:#fff;font-size:15px;font-weight:700;color:#334155;cursor:pointer;transition:all .15s;font-family:inherit;display:inline-block}
.drill-sel-chip:hover{border-color:#06b6d4;background:#f0fdfa;color:#0891b2}
#drillBody{flex:1;min-height:0;overflow-y:auto}

/* ══════════ 바디맵 전체화면 모달 ══════════ */
.bm-modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:background .35s ease,backdrop-filter .35s ease,-webkit-backdrop-filter .35s ease,opacity .35s ease}
.bm-modal.active{background:rgba(0,0,0,0.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto;opacity:1}
.bm-header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid #e2e8f0;background:#f8fafc;flex-shrink:0}
.bm-header-title{font-size:14px;font-weight:800;color:#1e293b}
.bm-header-sub{font-size:10px;color:#94a3b8;margin-top:2px}
.bm-header-right{display:flex;gap:8px;align-items:center}
.bm-close-btn{padding:6px 16px;border:1.5px solid #cbd5e1;border-radius:8px;background:#fff;color:#64748b;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.bm-confirm-btn{padding:6px 16px;border:none;border-radius:8px;background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}

.bm-inner{background:#fff;border-radius:16px;box-shadow:0 16px 64px rgba(0,0,0,0.25);width:98vw;max-width:1200px;height:96vh;display:flex;flex-direction:column;overflow:hidden;transform:scale(0.92);opacity:0;transition:transform .3s cubic-bezier(0.34,1.56,0.64,1),opacity .25s ease}
.bm-modal.active .bm-inner{transform:scale(1);opacity:1}
.bm-body{display:flex;flex:1;min-height:0;overflow:hidden}
.bm-left{width:520px;flex-shrink:0;padding:4px;display:flex;flex-direction:column;gap:3px;border-right:1px solid #e2e8f0;overflow:hidden}
.bm-pair{display:flex;gap:4px;min-height:0}
.bm-right{flex:1;display:flex;align-items:center;justify-content:flex-end;padding:0 6px 0 0;position:relative;overflow:hidden}

.bm-zone{position:relative;cursor:crosshair;user-select:none;-webkit-user-select:none;overflow:hidden}
.bm-zone img{width:100%;height:100%;object-fit:contain;display:block;border-radius:6px;border:1px solid #e2e8f0;background:#fff;pointer-events:none;-webkit-user-drag:none}
.bm-zone .bm-markers{position:absolute;inset:0;pointer-events:none}
.bm-marker{position:absolute;width:20px;height:20px;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%);z-index:10;cursor:pointer;pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff;transition:transform .12s}
.bm-marker:hover{transform:translate(-50%,-50%) scale(1.2)}

/* 선택된 부위 태그 — 숨김 */
.bm-sel-bar{display:none}

/* ══════════ 증상 선택 아코디언 (바디맵 하단) ══════════ */
.bm-symptom-bar{flex-shrink:0;border-top:1px solid #e2e8f0;background:#f8fafc}
.bm-symptom-toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;cursor:pointer;user-select:none}
.bm-symptom-toggle-title{font-size:13px;font-weight:700;color:#0891b2}
.bm-symptom-toggle-arrow{font-size:14px;color:#94a3b8;transition:transform .2s}
.bm-symptom-toggle-arrow.open{transform:rotate(180deg)}
.bm-symptom-body{display:none;padding:8px 16px 12px;max-height:180px;overflow-y:auto}
.bm-symptom-body.open{display:block}
.bm-sym-group{margin-bottom:8px}
.bm-sym-group-title{font-size:10px;font-weight:700;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.3px}
.bm-sym-chips{display:flex;flex-wrap:wrap;gap:4px}
.bm-sym-chip{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;border:1px solid #e2e8f0;background:#fff;color:#334155;cursor:pointer;transition:all .12s}
.bm-sym-chip:hover{border-color:#06b6d4;background:rgba(6,182,212,0.06)}
.bm-sym-chip.selected{border-color:#0891b2;background:#e0f7fa;color:#065f78}
.bm-tag:hover{background:#fee2e2;color:#dc2626;border-color:#fecaca}
.bm-hint-text{font-size:10px;color:#94a3b8}

/* ══════════ 기타 ══════════ */
.guide-box{padding:clamp(16px,2.5vw,28px);background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border-radius:14px;border:1px solid #e2e8f0;text-align:center;margin-bottom:12px}
.guide-emoji{font-size:42px;display:block;margin-bottom:10px}
.guide-text{font-size:clamp(13px,1.4vw,16px);color:#334155;line-height:1.8;white-space:pre-line}
.reception-popup{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;animation:fadeIn .3s ease}
.popup-content{background:#fff;border-radius:20px;padding:36px 52px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,0.2);animation:popIn .3s ease}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}

/* ══════════ 반응형 (태블릿 세로) ══════════ */
@media(max-width:768px){
  .top-bar{padding:8px 14px}
  .tb-school{font-size:13px}
  .bm-left{width:300px}
}
</style>
</head>
<body>

<!-- ══════════ 배경 (이미지 or 그라디언트) ══════════ -->
<div class="bg-gradient"></div>
<div class="bg-image" id="bgImage"></div>

<!-- ══════════ 탑바 ══════════ -->
<div class="top-bar" id="topBar">
  <div class="tb-school"><span>🏫</span> <span>OO학교 보건실</span></div>
  <div class="tb-right">
    <div class="queue-badge">현재 대기 인원 <span id="topQueue">0</span> 명</div>
  </div>
</div>

<!-- ══════════ 세로형: 전체 화면 중앙 정렬 ══════════ -->
<div class="kiosk-portrait">

    <!-- ━━━ 화면 1: 인적사항 드릴다운 ━━━ -->
    <div id="screen-s_personal" class="screen active">
      <h2>👤 방문자를 선택해주세요.</h2>
      <div class="personal-drill">
        <div style="display:flex;justify-content:center;gap:6px;margin-bottom:12px;flex-shrink:0">
          <button class="drill-tab active" id="drillTabStu" data-action="drill-tab" data-type="student">🎒 학생</button>
          <button class="drill-tab" id="drillTabStaff" data-action="drill-tab" data-type="staff">👨‍🏫 교직원</button>
        </div>
        <div id="drillBody"></div>
      </div>
    </div>

    <!-- ━━━ 화면 2: 방문 목적 ━━━ -->
    <div id="screen-s_purpose" class="screen">
      <h2>📋 방문 목적 선택</h2>
      <div class="btn-list">
        <button class="main-btn" data-action="fd-opt-action" data-sec-id="s_purpose" data-opt-id="o_p1"><span class="btn-emoji">🤕</span><span>불편한 곳이 있어서 왔어요.</span></button>
        <button class="main-btn" data-action="fd-opt-action" data-sec-id="s_purpose" data-opt-id="o_p2"><span class="btn-emoji">💬</span><span>다른 이유로 왔어요.</span></button>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:12px"><button class="back-btn" data-action="go-screen" data-target="s_personal" style="flex:none;min-width:auto;padding:8px 16px;font-size:12px">← 뒤로</button><button class="back-btn" data-action="go-home" style="flex:none;min-width:auto;padding:8px 16px;font-size:12px">🏠 처음으로</button></div>
    </div>

    <!-- ━━━ 완료 ━━━ -->
    <div id="screen-__done" class="screen"><div style="font-size:64px;margin-bottom:16px">✅</div><h2>접수가 완료되었습니다.</h2></div>

    <!-- ━━━ 팝업 ━━━ -->
    <div id="reception-popup" class="reception-popup" style="display:none">
      <div class="popup-content">
        <div style="font-size:48px;margin-bottom:12px">✅</div>
        <div style="font-size:18px;font-weight:800;margin-bottom:8px">접수되었습니다.</div>
        <div id="popup-wait-msg" style="font-size:14px;color:#64748b"></div>
      </div>
    </div>

</div><!-- /kiosk-portrait -->

<!-- ══════════ 바디맵 전체화면 모달 (프로그램과 동일) ══════════ -->
<div class="bm-modal" id="bmModal">
  <div class="bm-inner">
  <div class="bm-header">
    <div>
      <div class="bm-header-title">🧍 바디맵 — 아픈 부위를 알려주세요</div>
      <div class="bm-header-sub">터치(클릭) 한 번: 불편한 곳 체크 · 터치(클릭) 두 번: 통증의 정도를 숫자로 입력</div>
    </div>
    <div class="bm-header-right">
      <button class="bm-close-btn" data-action="bm-cancel">취소</button>
      <button class="bm-confirm-btn" data-action="bm-confirm">확인</button>
    </div>
  </div>
  <div class="bm-body">
    <!-- 왼쪽: 얼굴/치아/손/발 -->
    <div class="bm-left">
      <div class="bm-pair" style="flex:1">
        <div class="bm-zone" data-bm-key="face" style="flex:1"><img crossorigin="anonymous" src="../assets/bodymap/face_adult.png"><div class="bm-markers"></div></div>
        <div class="bm-zone" data-bm-key="teeth" style="flex:1"><img crossorigin="anonymous" src="../assets/bodymap/adult_teeth.png"><div class="bm-markers"></div></div>
      </div>
      <div class="bm-pair" style="flex:0.55">
        <div class="bm-zone" data-bm-key="handTop" style="flex:1"><img crossorigin="anonymous" src="../assets/bodymap/hands-top.png"><div class="bm-markers"></div></div>
        <div class="bm-zone" data-bm-key="palm" style="flex:1"><img crossorigin="anonymous" src="../assets/bodymap/palm.png"><div class="bm-markers"></div></div>
      </div>
      <div class="bm-pair" style="flex:0.7">
        <div class="bm-zone" data-bm-key="footTop" style="flex:1"><img crossorigin="anonymous" src="../assets/bodymap/foot_top.png"><div class="bm-markers"></div></div>
        <div class="bm-zone" data-bm-key="footBottom" style="flex:1"><img crossorigin="anonymous" src="../assets/bodymap/foot_bottom.png"><div class="bm-markers"></div></div>
      </div>
    </div>
    <!-- 오른쪽: 전신 -->
    <div class="bm-right">
      <div class="bm-zone" data-bm-key="body" style="height:98%;display:inline-block"><img crossorigin="anonymous" src="../assets/bodymap/adult_body.png" style="height:100%;width:auto"><div class="bm-markers"></div></div>
    </div>
  </div>
  <div class="bm-sel-bar" id="bmSelBar">
    <span class="bm-hint-text">선택된 부위가 여기에 표시됩니다</span>
  </div>
  </div><!-- /bm-inner -->
</div>

<script>
/* ══════════════════════════════════════════
   키오스크 JavaScript (기본형 세로)
   ══════════════════════════════════════════ */
var RELAY_URL = "";
var RELAY_CHANNEL = "";
var PEOPLE_DATA = [
  {"uid":"s1","name":"김민준","type":"student","grade":1,"cls":1,"num":1,"gender":"M"},
  {"uid":"s2","name":"이서연","type":"student","grade":1,"cls":1,"num":2,"gender":"F"},
  {"uid":"s3","name":"박지훈","type":"student","grade":1,"cls":2,"num":1,"gender":"M"},
  {"uid":"s4","name":"최수아","type":"student","grade":1,"cls":2,"num":2,"gender":"F"},
  {"uid":"s5","name":"정우진","type":"student","grade":2,"cls":1,"num":1,"gender":"M"},
  {"uid":"s6","name":"강하은","type":"student","grade":2,"cls":1,"num":2,"gender":"F"},
  {"uid":"s7","name":"조민서","type":"student","grade":2,"cls":2,"num":1,"gender":"F"},
  {"uid":"s8","name":"윤도현","type":"student","grade":3,"cls":1,"num":1,"gender":"M"},
  {"uid":"s9","name":"한예린","type":"student","grade":3,"cls":1,"num":2,"gender":"F","level":"고","department":"간호과"},
  {"uid":"st1","name":"김보건","type":"staff","position":"보건교사"},
  {"uid":"st2","name":"이담임","type":"staff","position":"담임교사"}
];

var FLOW = [
  {id:"s_personal",type:"personal_info",parentId:null,options:[]},
  {id:"s_purpose",headerName:"방문 목적 선택",type:"choice",parentId:null,options:[
    {id:"o_p1",label:"불편한 곳이 있어서 왔어요.",emoji:"🤕",target:"__done",hasBodymapInsert:true},
    {id:"o_p2",label:"다른 이유로 왔어요.",emoji:"💬",target:"__done"}
  ]}
];

/* ── 상태 ── */
var _selectedPerson = null, _selectedOptions = [], _bodymapData = [], _waitCount = 0;
var _currentScreen = "s_personal", _navHistory = [];
var _waitQueue = []; /* 대기인원 목록 */

function _personInfoText(p) {
  if (!p) return '';
  if (p.type === 'staff') return p.position || '교직원';
  var parts = [];
  if (p.level) parts.push(p.level);
  if (p.department) parts.push(p.department);
  if (p.grade) parts.push(p.grade + '-' + (p.cls || 0));
  return parts.join(' ');
}

function updateQueueDisplay() {

    while (next === _bgIdx && BG_IMAGES.length > 1) next = Math.floor(Math.random() * BG_IMAGES.length);

    el.style.opacity = "0";
    setTimeout(function() { el.style.backgroundImage = "url(" + BG_IMAGES[_bgIdx] + ")"; el.style.opacity = "1"; }, 1500);

function goScreen(id) {
  _navHistory.push(_currentScreen);
  _currentScreen = id;
  document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
  var el = document.getElementById("screen-" + id);
  if (el) el.classList.add("active");
}
function goBack() {
  if (_navHistory.length) {
    var prev = _navHistory.pop();
    _currentScreen = prev;
    document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
    var el = document.getElementById("screen-" + prev);
    if (el) el.classList.add("active"); else resetToPersonal();
  } else resetToPersonal();
}

var _people = [], _drillTab = "student", _drillSelGrade = 0, _drillSelCls = 0;
setTimeout(function() { drillShowTab("student"); }, 0);

function drillShowTab(type) {
  _drillTab = type;
  document.getElementById("drillTabStu").className = "drill-tab" + (type === "student" ? " active" : "");
  document.getElementById("drillTabStaff").className = "drill-tab" + (type === "staff" ? " active" : "");
  var body = document.getElementById("drillBody"); if (!body) return;
  _drillSelGrade = 0; _drillSelCls = 0;
  if (type === "staff") {
    var staff = PEOPLE_DATA.filter(function(p) { return p.type === "staff"; }).sort(function(a, b) { return a.name.localeCompare(b.name); });
    _people = staff;
    var h = '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">';
    staff.forEach(function(p, i) { h += '<span class="drill-sel-chip" data-action="drill-select" data-idx="' + i + '">' + p.name + (p.position ? " (" + p.position + ")" : "") + '</span>'; });
    body.innerHTML = h + '</div>';
  } else {
    var grades = []; PEOPLE_DATA.forEach(function(p) { if (p.type === "student" && p.grade && grades.indexOf(p.grade) === -1) grades.push(p.grade); });
    grades.sort(function(a, b) { return a - b; });
    var h = '<div class="drill-grade-grid">';
    grades.forEach(function(g) { h += '<button class="drill-grade-btn" data-action="drill-grade" data-grade="' + g + '">' + g + '학년</button>'; });
    body.innerHTML = h + '</div><div id="drillGradeBody"></div>';
  }
}

function drillSelectGrade(grade) {
  _drillSelGrade = grade; _drillSelCls = 0;
  document.querySelectorAll(".drill-grade-btn").forEach(function(b) { b.className = "drill-grade-btn" + (parseInt(b.dataset.grade) === grade ? " active" : ""); });
  var gb = document.getElementById("drillGradeBody"); if (!gb) return;
  var stu = PEOPLE_DATA.filter(function(p) { return p.type === "student" && p.grade === grade; });
  var classes = {}; stu.forEach(function(p) { if (!classes[p.cls]) classes[p.cls] = []; classes[p.cls].push(p); });
  var h = '<div style="display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;padding:4px">';
  Object.keys(classes).sort(function(a, b) { return a - b; }).forEach(function(c) {
    var list = classes[c].sort(function(a, b) { return a.num - b.num; });
    h += '<div class="drill-cls-panel" data-action="drill-cls" data-cls="' + c + '"><div class="drill-cls-title">' + grade + '학년 ' + c + '반 (' + list.length + '명)</div><div style="display:flex;flex-wrap:wrap;gap:4px">';
    list.forEach(function(s) {
      var extra = s.level ? ' [' + s.level + (s.department ? ' ' + s.department : '') + ']' : '';
      h += '<span class="drill-chip">' + s.num + '번 ' + extra + s.name + '</span>';
    });
    h += '</div></div>';
  });
  gb.innerHTML = h + '</div>';
}

function drillSelectClass(cls) {
  _drillSelCls = parseInt(cls);
  var gb = document.getElementById("drillGradeBody"); if (!gb) return;
  var students = PEOPLE_DATA.filter(function(p) { return p.type === "student" && p.grade === _drillSelGrade && p.cls === _drillSelCls; }).sort(function(a, b) { return a.num - b.num; });
  _people = students;
  var h = '<div style="border:2px solid #06b6d4;border-radius:12px;padding:14px;background:#f0fdfa">';
  h += '<div style="font-size:13px;font-weight:700;color:#0891b2;margin-bottom:10px">' + _drillSelGrade + '학년 ' + _drillSelCls + '반 (' + students.length + '명) <span data-action="drill-back-grade" style="font-size:10px;color:#94a3b8;cursor:pointer;margin-left:8px">← 반 목록으로</span></div>';
  h += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
  students.forEach(function(p, i) {
    var extra = p.level ? ' [' + p.level + (p.department ? ' ' + p.department : '') + ']' : '';
    h += '<span class="drill-sel-chip" data-action="drill-select" data-idx="' + i + '">' + p.num + '번 ' + extra + p.name + '</span>';
  });
  gb.innerHTML = h + '</div></div>';
}

/* ═══════════════════════════════════
   플로우 옵션 액션
   ═══════════════════════════════════ */
function fdOptAction(secId, optId) {
  var sec = FLOW.find(function(s) { return s.id === secId; }); if (!sec) return;
  var opt = (sec.options || []).find(function(o) { return o.id === optId; }); if (!opt) return;

  /* 바디맵 삽입이 있으면 전체화면 바디맵 모달 열기 */
  if (opt.hasBodymapInsert) {
    _selectedOptions.push({ secId: secId, optId: optId, label: opt.label });
    openBodymapModal();
    return;
  }

  /* 바디맵 없으면 즉시 접수 */
  _selectedOptions.push({ secId: secId, optId: optId, label: opt.label });
  submitAndReset(secId);
}

/* 릴레이로는 UID 만 전송 — 개인정보(이름·학년·반·번호·성별) 는 절대 서버를 거치지 않음.
 * nurse PC 가 받은 UID 로 자기 DB(S.people) 에서 풀네임 등 인적사항을 조회하여 표시. */
function _personIdOnly(p) { return p ? { uid: p.uid || p.id || '' } : {}; }

function submitAndReset(secId) {
  sendReception({ person: _personIdOnly(_selectedPerson), options: _selectedOptions, bodymap: _bodymapData, symptoms: [], treatments: [], time: new Date().toISOString() });
  showReceptionPopup();
}

function showReceptionPopup() {
  var popup = document.getElementById("reception-popup");
  var msg = document.getElementById("popup-wait-msg");
  _waitCount++;
  /* 대기 목록에 방문자 추가 */
  if (_selectedPerson) {
    _waitQueue.push({ name: _selectedPerson.name, info: _personInfoText(_selectedPerson) });
  }
  updateQueueDisplay();
  msg.textContent = "현재 대기 인원 " + _waitCount + "명입니다.";
  popup.style.display = "flex";
  setTimeout(function() { popup.style.display = "none"; resetToPersonal(); }, 1500);
}

function resetToPersonal() {
  _selectedPerson = null; _selectedOptions = []; _bodymapData = [];
  _navHistory = []; _currentScreen = "s_personal";
  document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
  document.getElementById("screen-s_personal").classList.add("active");
  drillShowTab("student");
}

/* object-fit:contain의 실제 이미지 영역 계산 */
function bmActualRect(img) {
  var r = img.getBoundingClientRect();
  var nw = img.naturalWidth || r.width, nh = img.naturalHeight || r.height;
  var ratio = nw / nh, cRatio = r.width / r.height;
  var aw, ah, ox, oy;
  if (ratio > cRatio) { aw = r.width; ah = r.width / ratio; ox = 0; oy = (r.height - ah) / 2; }
  else { ah = r.height; aw = r.height * ratio; ox = (r.width - aw) / 2; oy = 0; }
  return { left: r.left + ox, top: r.top + oy, width: aw, height: ah };
}

function bmNearest(parts, xPct, yPct) {
  var best = null, bd = Infinity;
  parts.forEach(function(p) { var d = (xPct - p.cx) * (xPct - p.cx) + (yPct - p.cy) * (yPct - p.cy); if (d < bd) { bd = d; best = p; } });
  return best ? best.l : "미지정";
}

function bmRenderAll() {
  /* 마커 렌더링 */
  document.querySelectorAll(".bm-zone .bm-markers").forEach(function(ov) { ov.innerHTML = ""; });
  _bodymapData.forEach(function(mk, mi) {
    var zone = document.querySelector('.bm-zone[data-bm-key="' + mk.imgKey + '"] .bm-markers');
    if (!zone) return;
    var dot = document.createElement("div"); dot.className = "bm-marker";
    dot.style.left = mk.x + "%"; dot.style.top = mk.y + "%";
    if (mk.nrs === 0) { dot.style.background = "#22c55e"; dot.textContent = "✓"; }
    else { dot.style.background = _nrsColors[Math.min((mk.nrs || 1) - 1, 9)]; dot.textContent = mk.nrs; }
    dot.dataset.idx = mi;
    zone.appendChild(dot);
  });
  /* 태그 바 */
  var bar = document.getElementById("bmSelBar");
  if (_bodymapData.length === 0) { bar.innerHTML = '<span class="bm-hint-text">선택된 부위가 여기에 표시됩니다</span>'; return; }
  var h = '';
  _bodymapData.forEach(function(mk, mi) {
    h += '<span class="bm-tag" data-action="bm-remove" data-idx="' + mi + '">' + mk.label + (mk.nrs ? " (NRS " + mk.nrs + ")" : "") + ' ✕</span>';
  });
  bar.innerHTML = h;
}

/* 이미지 투명 영역 체크 — 색이 있는 부분만 클릭 허용 (프로그램과 동일) */
function bmHasPixel(img, xPct, yPct) {
  try {
    if (!img._bmCache) {
      var cv = document.createElement("canvas");
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      var ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0);
      img._bmCache = { ctx: ctx, w: img.naturalWidth, h: img.naturalHeight };
    }
    var cx = Math.floor(xPct / 100 * img._bmCache.w);
    var cy = Math.floor(yPct / 100 * img._bmCache.h);
    var r = 3; /* 반경 3px 검사 */
    var sx = Math.max(0, cx - r), sy = Math.max(0, cy - r);
    var sw = Math.min(img._bmCache.w - sx, r * 2 + 1);
    var sh = Math.min(img._bmCache.h - sy, r * 2 + 1);
    if (sw > 0 && sh > 0) {
      var id = img._bmCache.ctx.getImageData(sx, sy, sw, sh).data;
      for (var i = 3; i < id.length; i += 4) {
        if (id[i] > 30) return true; /* 알파값 > 30 → 색이 있는 영역 */
      }
    }
    return false;
  } catch (ex) { return true; /* CORS 등 오류 시 허용 */ }
}

/* 바디맵 존 클릭 */
document.getElementById("bmModal").addEventListener("click", function(e) {
  var zone = e.target.closest(".bm-zone");
  if (!zone || e.target.classList.contains("bm-marker")) return;
  var key = zone.dataset.bmKey;
  var parts = BM_ZONE_MAP[key]; if (!parts) return;
  var img = zone.querySelector("img"); if (!img) return;
  var ar = bmActualRect(img);
  var xPct = (e.clientX - ar.left) / ar.width * 100;
  var yPct = (e.clientY - ar.top) / ar.height * 100;
  if (xPct < 0 || xPct > 100 || yPct < 0 || yPct > 100) return;
  /* 투명 영역 클릭 무시 */
  if (!bmHasPixel(img, xPct, yPct)) return;
  var label = bmNearest(parts, xPct, yPct);
  var existing = _bodymapData.findIndex(function(d) { return d.imgKey === key && d.label === label; });
  if (existing >= 0) { _bodymapData.splice(existing, 1); }
  else { _bodymapData.push({ imgKey: key, x: xPct, y: yPct, label: label, nrs: 0 }); }
  bmRenderAll();
});

/* 마커 클릭 → NRS 팝업 (클릭 위치 전달) */
document.getElementById("bmModal").addEventListener("click", function(e) {
  if (!e.target.classList.contains("bm-marker")) return;
  e.stopPropagation();

  var mk = _bodymapData[idx]; if (!mk) return;
  showNrsPopup(mk.label, idx, e.clientX, e.clientY);
}, true);

/* NRS 팝업 — 프로그램과 동일: 클릭 위치 옆에 작은 팝업, 번호 클릭 시 즉시 적용 */
function showNrsPopup(label, idx, clientX, clientY) {
  var mk = _bodymapData[idx]; if (!mk) return;
  var old = document.getElementById("bmNrsPop"); if (old) old.remove();
  var pop = document.createElement("div"); pop.id = "bmNrsPop";
  var px = (clientX || 400) + 10, py = (clientY || 300) - 20;
  if (px + 320 > window.innerWidth) px = window.innerWidth - 330;
  if (py + 100 > window.innerHeight) py = window.innerHeight - 110;
  if (py < 10) py = 10;
  pop.style.cssText = "position:fixed;left:" + px + "px;top:" + py + "px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;box-shadow:0 8px 32px rgba(0,0,0,0.4);z-index:12000;display:flex;flex-direction:column;gap:4px;align-items:center";
  pop.innerHTML = '<div style="font-size:10px;color:#94a3b8">통증 척도(NRS)</div>'
    + '<div style="display:flex;gap:4px" id="bmNrsButtons"></div>'
    + '<img crossorigin="anonymous" src="../assets/bodymap/scale.png" style="width:280px;margin-top:2px;border-radius:4px" onerror="this.style.display=\'none\'">';
  var btns = pop.querySelector("#bmNrsButtons");
  for (var n = 1; n <= 10; n++) {
    (function(nrs) {
      var btn = document.createElement("button"); btn.textContent = nrs;
      btn.style.cssText = "width:26px;height:26px;border-radius:50%;border:none;font-size:11px;font-weight:800;color:#fff;cursor:pointer;background:" + _nrsColors[Math.min(nrs - 1, 9)] + ";transition:transform .1s";
      btn.addEventListener("mouseenter", function() { btn.style.transform = "scale(1.2)"; });
      btn.addEventListener("mouseleave", function() { btn.style.transform = "scale(1)"; });
      btn.addEventListener("click", function(ev) {
        ev.stopPropagation();
        _bodymapData[idx].nrs = nrs;
        pop.remove();
        bmRenderAll();
      });
      btns.appendChild(btn);
    })(n);
  }
  /* 바깥 클릭으로 닫기 */
  setTimeout(function() {
    document.addEventListener("click", function closeNrs(ev) {
      if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener("click", closeNrs); }
    });
  }, 50);
  document.body.appendChild(pop);
}

/* ── 릴레이 ── */
function sendReception(payload) {
  if (!RELAY_URL || !RELAY_CHANNEL) return;
  fetch(RELAY_URL + "/api/v1/kiosk/reception/" + encodeURIComponent(RELAY_CHANNEL), {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
  }).catch(function() {});
}

/* ═══════════════════════════════════
   릴레이 WebSocket — 호출 시 대기인원 감소
   ═══════════════════════════════════ */
function removeFromQueue(personName) {
  var idx = -1;
  for (var i = 0; i < _waitQueue.length; i++) {
    if (_waitQueue[i].name === personName) { idx = i; break; }
  }
  if (idx >= 0) {
    _waitQueue.splice(idx, 1);
    _waitCount = Math.max(0, _waitCount - 1);
    updateQueueDisplay();
  }
}

/* nurse_call payload 는 UID 만 들어있다 (서버에 개인정보 0).
 * 키오스크가 PEOPLE_DATA 에서 풀네임/학년/반 조회. */
function _lookupByUid(uid){
  if(!uid || !Array.isArray(PEOPLE_DATA)) return null;
  for (var i = 0; i < PEOPLE_DATA.length; i++) {
    var p = PEOPLE_DATA[i];
    if (p && (p.uid === uid || p.id === uid)) return p;
  }
  return null;
}
function showNurseCallBanner(payload) {
  if (!payload) return;
  /* 후방 호환: 옛 서버는 person_name 직접 보냈으나, 새 서버는 person.uid 만 보냄 */
  var name = payload.person_name || "";
  var gc   = payload.grade_class || "";
  if (!name && payload.person && payload.person.uid) {
    var p = _lookupByUid(payload.person.uid);
    if (p) {
      name = p.name || "방문자";
      if (p.type === "staff") {
        gc = p.position || "";
      } else {
        var parts = [];
        if (p.grade) parts.push(p.grade + "학년");
        if (p.cls)   parts.push(p.cls + "반");
        if (p.num)   parts.push(p.num + "번");
        gc = parts.join(" ");
      }
    } else {
      name = "방문자";
    }
  }
  if (!name) name = "방문자";
  var msg = payload.message || "들어오세요.";
  /* 대기열에서 해당 학생 제거 */
  removeFromQueue(name);
  /* 호출 배너 표시 */
  var old = document.getElementById("nurseCallBanner"); if (old) old.remove();
  var ov = document.createElement("div"); ov.id = "nurseCallBanner";
  ov.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;animation:fadeIn .3s ease";
  ov.innerHTML = '<div style="background:#fff;border-radius:24px;padding:40px 48px;text-align:center;box-shadow:0 16px 64px rgba(0,0,0,0.3);max-width:80vw">'
    + '<div style="font-size:72px;margin-bottom:16px">📢</div>'
    + '<div style="font-size:20px;color:#64748b;margin-bottom:8px">' + gc + '</div>'
    + '<div style="font-size:36px;font-weight:800;color:#1e293b;margin-bottom:16px">' + name + ' 학생</div>'
    + '<div style="font-size:28px;color:#0891b2;font-weight:700">' + msg + '</div></div>';
  document.body.appendChild(ov);
  setTimeout(function() { if (ov.parentNode) ov.remove(); }, 8000);
}

if (RELAY_URL && RELAY_CHANNEL) {
  (function() {
    function connect() {
      var ws = new WebSocket(RELAY_URL.replace(/^http/, "ws") + "/ws?channel=" + encodeURIComponent(RELAY_CHANNEL) + "&role=kiosk");
      ws.onmessage = function(e) {
        try {
          var m = JSON.parse(e.data);
          if (m.type === "waitCount" || m.type === "queue_update") {
            var c = (m.payload && m.payload.waiting_count) || m.count || 0;
            _waitCount = c;
            updateQueueDisplay();
          } else if (m.type === "nurse_call") {
            showNurseCallBanner(m.payload);
          } else if (m.type === "roster_updated") {
            /* 명단 갱신 */
          }
        } catch (x) {}
      };
      ws.onclose = function() { setTimeout(connect, 5000); };
      ws.onerror = function() {};
    }
    connect();
  })();
}

/* ═══════════════════════════════════
   이벤트 위임
   ═══════════════════════════════════ */
document.addEventListener("click", function(ev) {
  var t = ev.target.closest("[data-action]"); if (!t) return;
  var act = t.getAttribute("data-action");
  switch (act) {
    case "go-screen": goScreen(t.getAttribute("data-target")); break;
    case "go-back": goBack(); break;
    case "go-home": resetToPersonal(); break;
    case "fd-opt-action": fdOptAction(t.getAttribute("data-sec-id"), t.getAttribute("data-opt-id")); break;
    case "drill-tab": drillShowTab(t.getAttribute("data-type")); break;
    case "drill-grade": drillSelectGrade(parseInt(t.getAttribute("data-grade"))); break;
    case "drill-cls": drillSelectClass(t.getAttribute("data-cls")); break;
    case "drill-select": selectPerson(parseInt(t.getAttribute("data-idx"))); break;
    case "drill-back-grade": drillSelectGrade(_drillSelGrade); break;
    case "bm-cancel": closeBodymapModal(); break;
    case "bm-confirm": closeBodymapModal(); submitAndReset("s_purpose"); break;
    case "bm-remove":
      var ri = parseInt(t.getAttribute("data-idx"));
      _bodymapData.splice(ri, 1); bmRenderAll();
      break;
  }
});
