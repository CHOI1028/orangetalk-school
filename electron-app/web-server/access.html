<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>오렌지톡 보안 연결</title>
<style>:root{color-scheme:light dark;font-family:"Malgun Gothic",sans-serif;--paper:#fff;--ink:#24372c;--muted:#53635a;--line:#d9e3d8;--bg:#f1f5ee;--accent:#52823c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff2e4,var(--bg));color:var(--ink);padding:24px}main{width:min(100%,480px);padding:32px;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:0 12px 40px #2636290d}.brand{color:#df711f;font-weight:800;font-size:20px}h1{font-size:23px;letter-spacing:-.6px;margin:24px 0 12px}p{font-size:14px;line-height:1.8;color:var(--muted)}label{display:block;font-size:13px;font-weight:700;margin:24px 0 8px}input,button{width:100%;min-height:48px;font:inherit;border-radius:9px}input{padding:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}button{margin-top:12px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}input:focus-visible,button:focus-visible{outline:3px solid #ed8d3c;outline-offset:3px}#status{min-height:24px;margin-bottom:0}.note{font-size:12px;margin-top:24px}@media(prefers-color-scheme:dark){:root{--paper:#1d2b25;--ink:#edf3ed;--muted:#bccbbb;--line:#425547;--bg:#18251e;--accent:#4e773c}body{background:linear-gradient(135deg,#34281f,var(--bg))}}</style></head>
<body><main><div class="brand">오렌지톡</div><h1>메인 PC에 안전하게 연결하기</h1><p>메인 PC의 환경설정에서 <strong>보안 연결 주소</strong>를 복사해 이 브라우저로 열어 주세요.<br>기존 IP 주소만으로는 처음 접속할 수 없습니다.</p><form id="connect"><label for="address">보안 연결 주소</label><input id="address" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required placeholder="복사한 주소를 붙여 넣어 주세요"><button id="submit" type="submit">연결하기</button><p id="status" role="status" aria-live="polite"></p></form><p class="note">신뢰할 수 있는 학교 내부망에서 사용해 주세요.<br>이 주소는 보건업무 담당자에게만 전달해 주세요.</p></main>
<script>(function(){'use strict';var input=document.getElementById('address'),button=document.getElementById('submit'),status=document.getElementById('status');function keyFrom(value){value=String(value||'').trim();if(/^[a-f0-9]{64}$/.test(value))return value;try{return new URL(value,location.href).hash.replace(/^#ot-share=/,'');}catch(_){return '';}}async function connect(key){if(!/^[a-f0-9]{64}$/.test(key)){status.textContent='메인 PC에서 복사한 보안 연결 주소를 확인해 주세요.';return;}button.disabled=true;status.textContent='연결을 확인하고 있습니다.';try{var response=await fetch('/api/shared-access',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})});var data=await response.json();if(!response.ok||!data.success)throw new Error(data.error||'연결하지 못했습니다.');input.value='';location.replace('/');}catch(error){status.textContent=error.message||'연결 상태를 확인하고 다시 시도해 주세요.';button.disabled=false;}}document.getElementById('connect').addEventListener('submit',function(event){event.preventDefault();connect(keyFrom(input.value));});function connectFromHash(){if(location.hash.indexOf('#ot-share=')!==0)return;var key=keyFrom(location.href);history.replaceState(null,'',location.pathname+location.search);connect(key);}window.addEventListener('hashchange',connectFromHash);connectFromHash();})();</script></body></html>
