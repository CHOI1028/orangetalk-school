#medRcPreview{position:fixed;color:#000;box-sizing:border-box}

  #medPrintArea.mp-card{transform:none !important;left:auto !important;top:auto !important;overflow:visible !important;box-shadow:none !important;border:none !important}

<script>
/* document.write 가로채기 — 카카오 SDK 가 sub-chunk 로드에 document.write 를 사용하는데,
   페이지 로드 후 호출되면 body 가 wipe 된다. src 속성이 있는 script 태그 형식이면
   동일한 src 로 안전하게 appendChild 로 로드하도록 변환. */
(function(){
  var origWrite = document.write.bind(document);
  /* 정규식 리터럴 — \u003c 가 < 의 유니코드 escape. HTML 파서가 "script" 를 진짜 태그로 보지 않음. */
  var SCRIPT_TAG_RE = /\u003cscript[^>]*?src=["']([^"']+)["'][^>]*>/i;
  document.write = function(html){
    try{
      var s=String(html||'');
      var m=s.match(SCRIPT_TAG_RE);
      if(m && m[1]){
        var sc=document.createElement('script');
        sc.src=m[1];
        sc.async=false;  /* 순차 실행 보장 */
        (document.head||document.documentElement).appendChild(sc);
        console.info('[document.write 가로채기]', m[1]);
        return;
      }
    }catch(e){}
    if(document.readyState==='loading') origWrite(html);
    else console.warn('[document.write 차단]', String(html).substring(0,100));
  };
  document.writeln = document.write;
})();
/* 카카오 JS 키는 URL 쿼리에서 읽음 — 사용자가 설정에서 입력한 값 */
(function(){
  var qs = new URLSearchParams(location.search);
  var kakaoJs = qs.get('kakaoJs') || '';
  window._kakaoRestKey = qs.get('kakaoRest') || '';
  if (!kakaoJs) {
    document.addEventListener('DOMContentLoaded', function(){
      document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#64748b"><h2 style="color:#dc2626">카카오 API 키 미등록</h2><p>의료기관 탐색 기능을 사용하려면 카카오 JavaScript 키가 필요합니다.<br>설정 → API Key 관리 → 카카오 개발자 API 에서 키를 등록해 주세요.</p></div>';
    });
    return;
  }
  /* 카카오 SDK 로드 — IPC 로 본문 가져와 inline 주입 (script 태그의 ORB 차단 완전 우회).
     SDK 가 내부적으로 sub-chunk 를 로드할 때는 main 프로세스의 CORP 헤더가 ORB 막아줌. */
  var SDK_URL = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(kakaoJs) + '&autoload=false';
  if(!window.electronAPI || !window.electronAPI.externalFetchJson){
    window._kakaoSdkErrorBody='electronAPI 미주입';
  } else {
    window.electronAPI.externalFetchJson(SDK_URL).then(function(r){
      if(!r || !r.success || !r.data){
        window._kakaoSdkErrorBody = (r && r.error) || 'IPC 응답 없음';
        return;
      }
      var body = String(r.data);
      /* 카카오 에러 응답 (JSON) 그대로 표시 */
      if(body.charAt(0)==='{' && body.indexOf('errorType')!==-1){
        window._kakaoSdkErrorBody = body.substring(0,500);
        return;
      }
      /* SDK 코드 inline 주입 — cross-origin 자체가 발생 안 함 */
      try{
        var inline = document.createElement('script');
        inline.textContent = body;
        document.head.appendChild(inline);
      }catch(e){
        window._kakaoSdkErrorBody = 'inline 주입 실패: '+(e&&e.message||'');
      }
    }).catch(function(e){
      window._kakaoSdkErrorBody='IPC 호출 실패: '+(e&&e.message||'');
    });
  }
})();
/* 웹 브라우저 버전: electronAPI 가 없으면 window-web bridge 주입 (Electron 버전은 preload.js 가 이미 electronAPI 를 주입해둠).
   document.write 는 페이지 로드 후 실행되면 body 를 wipe 하므로 appendChild 로 안전하게 주입. */
if (!window.electronAPI) {
  var _br=document.createElement('script');
  _br.src='/web-server/web-api-bridge.js';
  document.head.appendChild(_br);
}
</script>

<script>
var EXCLUDE=['동물','수의','산후','요양'];
var _p=new URLSearchParams(location.search);
var schoolName=decodeURIComponent(_p.get('school')||'');
var eduOffice=decodeURIComponent(_p.get('edu')||'');
var hiraKey=decodeURIComponent(_p.get('hira')||'');
var emergencyKey=decodeURIComponent(_p.get('emg')||'');
var schoolAddr=decodeURIComponent(_p.get('addr')||'');
/* 검색 기준: 주소가 있으면 주소, 없으면 교육청+학교명 */
var schoolQuery=schoolAddr||(schoolName?(eduOffice?eduOffice.replace(/교육청$/,'')+' ':'')+schoolName:'');
var _initMode=decodeURIComponent(_p.get('mode')||'').trim();
var _initType=(_initMode==='emergency'||_initMode==='pharmacy')?_initMode:'hospital';
/* 부모 창에서 lat/lng 를 미리 보내주면 카카오 지오코딩 skip — 카카오 키가 비어있어도 지도가 뜸 */
var _preLat=parseFloat(decodeURIComponent(_p.get('lat')||''))||0;
var _preLng=parseFloat(decodeURIComponent(_p.get('lng')||''))||0;
/* localStorage 폴백 — URL 에 좌표가 안 왔으면 직접 읽음 */
if(!_preLat||!_preLng){
  try{
    _preLat=parseFloat(localStorage.getItem('ec_school_lat')||'0')||0;
    _preLng=parseFloat(localStorage.getItem('ec_school_lng')||'0')||0;
  }catch(e){}
}
var map=null,markers=[],infoWins=[],schoolLat=_preLat,schoolLng=_preLng,curType=_initType,schoolMk=null,_idle=null;

/* ═══ 의료기관 대량 캐시 — 설정에서 미리 저장한 반경 내 데이터 ═══
   지도 중심이 캐시된 기준지로부터 radius 내일 때 API 대신 로컬 필터로 즉시 표시. */
var _medFacCache=null;
var _cacheBaseLat=0,_cacheBaseLng=0,_cacheRadiusM=30000;
if(window.electronAPI&&window.electronAPI.medfacLoadCache){
  window.electronAPI.medfacLoadCache().then(function(r){
    if(r&&r.success&&r.exists&&r.data){
      _medFacCache=r.data;
      _cacheBaseLat=(_medFacCache.baseLocation&&_medFacCache.baseLocation.lat)||0;
      _cacheBaseLng=(_medFacCache.baseLocation&&_medFacCache.baseLocation.lng)||0;
      _cacheRadiusM=((_medFacCache.radiusKm||30))*1000;
      console.info('[medfac] 캐시 로드 완료 — 병원 '+(_medFacCache.hospitals||[]).length+'건, 약국 '+(_medFacCache.pharmacies||[]).length+'건, 응급실 '+(_medFacCache.emergency||[]).length+'건');
      /* 첫 진입 시 doSearch 가 이미 호출됐을 수 있음 → 캐시 도착 후 재실행 */
      if(map && schoolLat && _cacheContainsMap()) doSearch();
    }
  }).catch(function(){});
}
function _cacheContainsMap(){
  if(!_medFacCache||!map)return false;
  var c=map.getCenter();
  var d=distKm(_cacheBaseLat,_cacheBaseLng,c.getLat(),c.getLng())*1000;
  return d<=_cacheRadiusM;
}
function _searchFromCache(){
  if(!_medFacCache)return false;
  var srcArr=[];
  if(curType==='emergency') srcArr=_medFacCache.emergency||[];
  else if(curType==='pharmacy') srcArr=_medFacCache.pharmacies||[];
  else srcArr=_medFacCache.hospitals||[];
  if(!srcArr.length) return false;
  var list=srcArr.map(function(d){
    if(curType==='emergency'){
      var lat=parseFloat(d.wgs84Lat||0),lng=parseFloat(d.wgs84Lon||0);
      return {
        id:d.hpid||d.dutyName,
        place_name:d.dutyName||'',
        road_address_name:d.dutyAddr||'',
        phone:d.dutyTel1||d.dutyTel3||'',
        category_name:'의료,건강 > 응급의료기관',
        y:String(lat),x:String(lng),
        _dist:distKm(schoolLat,schoolLng,lat,lng)*1000,
        _emgInfo:{beds:d.hvec||'',surgery:d.hvoc||'',icuBeds:d.hvicc||'',ct:d.MKioskTy25||'',mri:d.MKioskTy1||'',eryn:d.dutyEryn||''}
      };
    } else {
      var x=parseFloat(d.XPos||d.wgs84Lon||0),y=parseFloat(d.YPos||d.wgs84Lat||0);
      return {
        id:d.ykiho||d.yadmNm,
        place_name:d.yadmNm||'',
        road_address_name:d.addr||'',
        phone:d.telno||'',
        category_name:(d.clCdNm||'')+(curType==='pharmacy'?' > 약국':' > 병원'),
        y:String(y),x:String(x),
        _dist:distKm(schoolLat,schoolLng,y,x)*1000
      };
    }
  });
  /* 진료과 필터 */
  if(curType==='hospital' && _curDept){
    var deptLc=_curDept.toLowerCase();
    list=list.filter(function(d){
      var n=(d.place_name||'').toLowerCase();
      var c=(d.category_name||'').toLowerCase();
      return n.indexOf(deptLc)!==-1||c.indexOf(deptLc)!==-1;
    });
  }
  var rMax=(curType==='emergency')?80000:(_cacheRadiusM||30000);
  list=list.filter(function(d){return d._dist<=rMax;});
  list.sort(function(a,b){return a._dist-b._dist;});
  console.info('[medfac-cache] 히트 — type='+curType+(curType==='hospital'&&_curDept?' dept='+_curDept:'')+' → '+list.length+'건 (API 호출 0)');
  render(list);
  return true;
}

(function(){

  if(!target||!window.MutationObserver) return;
  new MutationObserver(function(muts){
    muts.forEach(function(m){

        if(n.id==='map' || (n.querySelector && n.querySelector('#map'))){
          window._mapDivRemovedTrace = (window._mapDivRemovedTrace||[]).concat(['removed at '+Date.now()+' parent='+(n.parentNode&&n.parentNode.tagName)+' stack='+(new Error()).stack.split('\n').slice(1,4).join(' | ')]);
          console.error('[MAPDIV REMOVED]', n.outerHTML?n.outerHTML.substring(0,100):n);

      });

function initMap(){
  /* 진단 로그 — 매 폴링마다 현재 상태 기록 */
  var mapDiv=document.getElementById('map');
  var divOK=mapDiv && mapDiv.offsetWidth>0 && mapDiv.offsetHeight>0;
  var sdkOK=!!(window.kakao && window.kakao.maps && window.kakao.maps.LatLng);
  window._lastInitCheck={
    elapsed: Date.now()-_initStartedAt,
    divOK: divOK,
    divSize: mapDiv?(mapDiv.offsetWidth+'x'+mapDiv.offsetHeight):'no-div',
    sdkOK: sdkOK,
    hasKakao: !!window.kakao,
    hasKakaoMaps: !!(window.kakao&&window.kakao.maps),
    hasLatLng: !!(window.kakao&&window.kakao.maps&&window.kakao.maps.LatLng),
    sdkErrorBody: window._kakaoSdkErrorBody
  };
  if(!divOK || !sdkOK){
    if(Date.now()-_initStartedAt>8000){
      var _body = String(window._kakaoSdkErrorBody||'(본문 미수신)').substring(0,300);
      var _state = JSON.stringify(window._lastInitCheck||{},null,2);
      console.error('[MEDFAC INIT FAIL]', _state, '\nSDK Body:', _body);
      var _panel=document.getElementById('listPanel');
      if(_panel) _panel.innerHTML='<div style="padding:20px;color:#dc2626;font-size:11px;line-height:1.6"><b>⚠ 초기화 실패</b><br>콘솔(Cmd+Opt+I) 에서 [MEDFAC INIT FAIL] 로그 확인</div>';
      var _mapDv=document.getElementById('map');
      if(_mapDv) _mapDv.innerHTML='';
      _initStartedAt=Date.now();  /* 한 번 표시 후 폴링 멈춤 — return 만으로 멈추지만 안전장치 */
      return;
    }
    setTimeout(initMap,200);return;
  }
  if(kakao.maps.load){kakao.maps.load(doInit);} else {doInit();}
}

/* ── 카카오 카테고리 검색 (폴백) ── */
function searchKakaoCategory(type){
  var center=map.getCenter();
  var catCode=type==='pharmacy'?'PM9':'HP8';
  /* 밀집 지역 대응 — 9개 좌표에서 분산 검색 (최대 405건 → 중복제거) */
  var off=0.03;
  var pts=[
    {x:center.getLng(),y:center.getLat()},
    {x:center.getLng()+off,y:center.getLat()},
    {x:center.getLng()-off,y:center.getLat()},
    {x:center.getLng(),y:center.getLat()+off*0.8},
    {x:center.getLng(),y:center.getLat()-off*0.8},
    {x:center.getLng()+off,y:center.getLat()+off*0.8},
    {x:center.getLng()-off,y:center.getLat()+off*0.8},
    {x:center.getLng()+off,y:center.getLat()-off*0.8},
    {x:center.getLng()-off,y:center.getLat()-off*0.8}
  ];
  var allData=[],done=0,total=pts.length*3;
  pts.forEach(function(pt){
    [1,2,3].forEach(function(pg){
      apiCat(catCode,pt.x,pt.y,5000,pg).then(function(r){
        done++;
        if(r&&r.success&&r.data)allData=allData.concat(r.data);
        if(done>=total){
          var seen={};
          var list=allData.filter(function(d){
            if(seen[d.id])return false;seen[d.id]=true;
            var nm=(d.place_name||'').toLowerCase(),cn=(d.category_name||'').toLowerCase();
            for(var i=0;i<EXCLUDE.length;i++){if(nm.indexOf(EXCLUDE[i])!==-1||cn.indexOf(EXCLUDE[i])!==-1)return false;}
            if(type==='hospital'&&cn.indexOf('산부인과')!==-1)return false;
            return true;
          });
          /* 거리는 항상 기준위치(schoolLat/schoolLng) 기준으로 계산 — 지도 이동 중심 거리는 무시 */
          list.forEach(function(d){
            d._dist=distKm(schoolLat,schoolLng,parseFloat(d.y),parseFloat(d.x))*1000;
          });
          list.sort(function(a,b){return a._dist-b._dist;});
          render(list);
        }
      });
    });
  });
}

/* ── 카카오 응급실 검색 + 국립중앙의료원 상세 보충 ── */
function searchKakaoEmergency(){
  var offset=0.45;
  var pts=[
    {x:schoolLng,y:schoolLat},
    {x:schoolLng+offset,y:schoolLat},
    {x:schoolLng-offset,y:schoolLat},
    {x:schoolLng,y:schoolLat+offset*0.8},
    {x:schoolLng,y:schoolLat-offset*0.8}
  ];
  var allEmg=[],doneEmg=0,totalEmg=pts.length*3;
  pts.forEach(function(pt){
    [1,2,3].forEach(function(pg){
      apiKw('응급실',pt.x,pt.y,20000,pg).then(function(r){
        doneEmg++;
        if(r&&r.success&&r.data)allEmg=allEmg.concat(r.data);
        if(doneEmg>=totalEmg){
          var seen={};
          var list=allEmg.filter(function(d){
            if(seen[d.id])return false;seen[d.id]=true;
            var cn=(d.category_name||'').toLowerCase();
            return cn.indexOf('병원')!==-1||cn.indexOf('의료')!==-1;
          });
          list.forEach(function(d){d._dist=distKm(schoolLat,schoolLng,parseFloat(d.y),parseFloat(d.x))*1000;});
          list=list.filter(function(d){return d._dist<=80000;});
          list.sort(function(a,b){return a._dist-b._dist;});
          /* 국립중앙의료원 API — 전국 목록에서 학교 근처 10건 찾아 상세 조회 */
          if(emergencyKey&&window.electronAPI&&window.electronAPI.externalFetchEmergency&&window.electronAPI.externalFetchEmergencyDetail){
            /* 여러 페이지 호출하여 전국 데이터 수집 */
            var allEmgApi=[],emgDone=0,emgPages=5;
            var promises=[];
            for(var p=1;p<=emgPages;p++){
              promises.push(window.electronAPI.externalFetchEmergency(emergencyKey,{lat:schoolLat,lng:schoolLng,pageNo:p}));
            }
            Promise.all(promises).then(function(results){
              results.forEach(function(r){if(r&&r.success&&r.data)allEmgApi=allEmgApi.concat(r.data);});
              /* 거리 계산 + 정렬 */
              allEmgApi.forEach(function(e){
                var lat=parseFloat(e.wgs84Lat||0),lng=parseFloat(e.wgs84Lon||0);
                e._dist=(lat&&lng)?distKm(schoolLat,schoolLng,lat,lng)*1000:9999000;
              });
              allEmgApi.sort(function(a,b){return a._dist-b._dist;});
              /* 상위 10건 hpid 상세 조회 */
              var top10=allEmgApi.slice(0,10).filter(function(e){return e.hpid;});
              var hpids=top10.map(function(e){return e.hpid;});
              if(!hpids.length){render(list);return;}
              window.electronAPI.externalFetchEmergencyDetail(emergencyKey,hpids).then(function(detRes){
                if(detRes&&detRes.success&&detRes.data){
                  /* hpid → 상세 매핑 */
                  var detMap={};
                  detRes.data.forEach(function(e){if(e&&e.hpid)detMap[e.hpid]=e;});
                  /* 카카오 결과와 이름 매칭 */
                  list.forEach(function(d){
                    var dName=(d.place_name||'').replace(/\s/g,'');
                    for(var hpid in detMap){
                      var eName=(detMap[hpid].dutyName||'').replace(/\s/g,'').replace(/\(.*?\)/g,'');
                      if(dName.indexOf(eName)!==-1||eName.indexOf(dName.replace(/응급의료센터|응급실|응급센터/g,''))!==-1){
                        var e=detMap[hpid];
                        d._emgInfo={beds:e.hvec||'',surgery:e.hvoc||'',icuBeds:e.hvicc||'',ct:e.MKioskTy25||'',mri:e.MKioskTy1||'',eryn:e.dutyEryn||''};
                        break;
                      }
                    }
                  });
                }
                render(list);
              }).catch(function(){render(list);});
            }).catch(function(){render(list);});
          } else {
            render(list);
          }
        }
      });
    });
  });
}

/* 마커 팝업 — 4방향 (위/아래/왼/오) 모두 잘리지 않도록 자동 전환.

  var marker=markers[iwIdx];
  if(!entry||!marker||!entry.htmlContent) return;
  var pt=null, mapW=0, mapH=0;
  try{
    var proj=map.getProjection();
    if(proj.containerPointFromCoords){pt=proj.containerPointFromCoords(marker.getPosition());}
    var mapDv=document.getElementById('map');
    mapW=mapDv?mapDv.offsetWidth:0;
    mapH=mapDv?mapDv.offsetHeight:0;
  }catch(e){}
  /* 수직 — 위쪽 공간 < 220px 이면 아래로 (팝업 높이 + 여유) */
  var showBelow = pt && pt.y<220;
  /* 수평 — 마커 픽셀 x 위치로 xAnchor 결정 (팝업 절반 너비 ~140px).
     왼쪽 가장자리 가까우면 xAnchor 작게(왼쪽 정렬), 오른쪽 가장자리면 크게(오른쪽 정렬). */
  var xA = 0.5;
  if(pt && mapW){
    if(pt.x < 150){ xA = Math.max(0.05, pt.x/300); } /* 왼쪽 끝: 0.05~0.5 */
    else if(pt.x > mapW-150){ xA = Math.min(0.95, 1 - (mapW-pt.x)/300); } /* 오른쪽 끝: 0.5~0.95 */
  }
  var wrapEl=document.createElement('div');
  wrapEl.style.cssText='pointer-events:auto;display:flex;flex-direction:column;align-items:center;animation:popIn .2s ease;position:relative;z-index:9999';
  var ovEl=document.createElement('div');
  ovEl.innerHTML=entry.htmlContent;
  ovEl.style.cssText='background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.18);border:1px solid #e2e8f0;max-width:280px;position:relative;z-index:9999';
  var tailEl=document.createElement('div');
  if(showBelow){
    tailEl.style.cssText='width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:8px solid #fff;filter:drop-shadow(0 -2px 2px rgba(0,0,0,0.08));margin-top:20px;position:relative;z-index:9999';
    wrapEl.appendChild(tailEl);wrapEl.appendChild(ovEl);
  } else {
    tailEl.style.cssText='width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.08));margin-bottom:20px;position:relative;z-index:9999';
    wrapEl.appendChild(ovEl);wrapEl.appendChild(tailEl);
  }
  /* 좌우 치우침에 따라 꼬리 위치도 조정 — 마커 바로 위에 꼬리가 가도록 transform translateX 적용 */
  if(xA !== 0.5){
    /* 꼬리는 wrapEl 가운데 위치 → wrapEl 자체가 xA 기준이므로 꼬리를 마커 방향으로 이동 */
    var tailShiftPx = (xA - 0.5) * 280; /* 팝업 너비 * 위치 차이 */
    tailEl.style.transform = 'translateX('+(tailShiftPx)+'px)';
  }
  var yA = showBelow ? -0.3 : 1.3;
  var ov=new kakao.maps.CustomOverlay({content:wrapEl,position:marker.getPosition(),xAnchor:xA,yAnchor:yA,zIndex:9999});
  ov.setMap(map);
  entry.currentOv=ov;
  _curOverlay=ov;_curOverlayEl=wrapEl;
};

var _renderToken = 0;  /* 진행 중인 점진 렌더 취소용 토큰 */
function render(list){
  _renderList=list;
  var panel=document.getElementById('listPanel');
  if(!list.length){panel.innerHTML='<div class="loading">검색 결과가 없습니다.</div>';return;}
  /* 즐겨찾기 상단 정렬 */
  list.sort(function(a,b){
    var fa=isFav(a.place_name)?0:1,fb=isFav(b.place_name)?0:1;
    if(fa!==fb)return fa-fb;
    return a._dist-b._dist;
  });
  /* ═══ 점진적 렌더링 — 가까운 순서대로 배치별 표시 ═══
     1차: 즉시 30건 (보통 5km 이내) → 2차: 100건 (~10km) → 3차: 전체
     각 배치 사이 requestAnimationFrame 으로 UI 응답성 유지. */
  var token = (++_renderToken);
  var FIRST=30, SECOND=100;
  /* 카운터 + 진행 표시 */
  panel.innerHTML='<div class="count">총 '+list.length+'건 — 가까운 순으로 표시 중...</div>';
  /* 마커·팝업 배열 초기화 */
  markers.forEach(function(m){m.setMap(null);});
  markers=[];infoWins=[];
  if(schoolMk)schoolMk.setMap(map);
  /* 누적 HTML 빌드용 */
  var accH='<div class="count" id="medfacCount">'+list.length+'건 (즐겨찾기 → 거리순)</div>';
  function _renderBatch(start, end, isFinal){
    if(token!==_renderToken) return;  /* 새 검색이 시작되면 이전 배치 취소 */
    var slice = list.slice(start, end);
    accH = _appendListItems(accH, slice, start);
    panel.innerHTML = accH + (isFinal ? '' : '<div class="loading" style="padding:14px;font-size:10px">⏳ '+(list.length-end)+'건 더 표시 중...</div>');
    _bindListItemEvents(panel);  /* 새로 추가된 list-item 들에 이벤트 바인딩 */
    _addMarkersForRange(slice, start);
    if(isFinal){
      var c=document.getElementById('medfacCount');
      if(c)c.textContent=list.length+'건 (즐겨찾기 → 거리순)';
    }
  }
  /* 배치 1: 즉시 */
  _renderBatch(0, Math.min(FIRST, list.length), list.length<=FIRST);
  /* 배치 2: 다음 frame */
  if(list.length>FIRST){
    requestAnimationFrame(function(){
      _renderBatch(FIRST, Math.min(SECOND, list.length), list.length<=SECOND);
      /* 배치 3: 나머지는 setTimeout 으로 분할 (50건씩) */
      if(list.length>SECOND){
        var pos=SECOND;
        var STEP=50;
        function _next(){
          if(token!==_renderToken) return;
          var nextEnd=Math.min(pos+STEP, list.length);
          _renderBatch(pos, nextEnd, nextEnd>=list.length);
          pos=nextEnd;
          if(pos<list.length) setTimeout(_next, 16);
        }
        setTimeout(_next, 16);
      }
    });
  }
  return;  /* 아래 기존 forEach 진입 안 함 — 함수 종료 */
}

/* 배치별 list-item HTML 생성 (i 는 list 전체 기준 인덱스) */
function _appendListItems(currentH, slice, startIdx){
  var h = currentH;
  slice.forEach(function(d, batchI){
    var i = startIdx + batchI;
    var cn=(d.category_name||'').toLowerCase();
    var ic;
    if(_curDept&&DEPT_IC[_curDept]){ic=DEPT_IC[_curDept];}
    else if(cn.indexOf('약국')!==-1){ic='💊';}
    else if(cn.indexOf('종합병원')!==-1||cn.indexOf('대학병원')!==-1||d.place_name.indexOf('응급')!==-1){ic='🚨';}
    else{ic='🏥';}
    var dist=d._dist<1000?(Math.round(d._dist)+'m'):((d._dist/1000).toFixed(1)+'km');
    var fav=isFav(d.place_name);
    h+='<div class="list-item" data-idx="'+i+'" style="'+(fav?'background:rgba(245,158,11,0.06);border-color:rgba(245,158,11,0.2)':'')+'">';
    h+='<div style="display:flex;align-items:center;gap:6px"><span>'+ic+'</span><span class="name" style="flex:1">'+esc(d.place_name)+'</span>';
    h+='<span class="fav-btn" data-fav-name="'+esc(d.place_name)+'" data-fav-idx="'+i+'" style="cursor:pointer;font-size:14px;flex-shrink:0;transition:transform .15s" title="즐겨찾기">'+(fav?'⭐':'☆')+'</span>';
    h+='<span class="dist">'+dist+'</span></div>';
    if(d.category_name)h+='<div class="cat">'+esc(d.category_name.split('>').pop().trim())+'</div>';
    h+='<div class="addr">'+esc(d.road_address_name||d.address_name||'')+'</div>';
    if(d.phone)h+='<div class="tel">📞 '+esc(d.phone)+'</div>';
    h+='<div class="med-print-row" style="margin-top:6px;display:flex;gap:6px"><button class="print-btn" data-print-idx="'+i+'" style="font-size:10px;padding:3px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155;cursor:pointer;font-weight:700">🖨 인쇄</button><button class="route-btn" data-route-idx="'+i+'" title="카카오맵 길찾기 (기준위치 → 이 의료기관)" style="font-size:10px;padding:3px 10px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#0e7490;cursor:pointer;font-weight:700">🧭 카카오맵 길찾기 열기</button></div>';
    if(d._emgInfo){
      var ei=d._emgInfo;
      var emgParts=[];
      if(ei.eryn)emgParts.push(ei.eryn==='Y'?'🟢 운영':'🔴 미운영');
      if(ei.beds)emgParts.push('🛏 병상 '+ei.beds);
      if(ei.icuBeds)emgParts.push('중환자 '+ei.icuBeds);
      if(ei.ct==='Y')emgParts.push('CT✅');
      if(ei.mri==='Y')emgParts.push('MRI✅');
      if(emgParts.length)h+='<div style="font-size:9px;color:#dc2626;font-weight:600;margin-top:2px">'+emgParts.join(' · ')+'</div>';
    }
    h+='</div>';
  });
  return h;
}

/* 배치별 마커·팝업 생성 (실제 지도 객체 추가) */
function _addMarkersForRange(slice, startIdx){
  slice.forEach(function(d, batchI){
    var i = startIdx + batchI;
    var cn=(d.category_name||'').toLowerCase();
    var ic;
    if(_curDept&&DEPT_IC[_curDept]){ic=DEPT_IC[_curDept];}
    else if(cn.indexOf('약국')!==-1){ic='💊';}
    else if(cn.indexOf('종합병원')!==-1||cn.indexOf('대학병원')!==-1||d.place_name.indexOf('응급')!==-1){ic='🚨';}
    else{ic='🏥';}
    var dist=d._dist<1000?(Math.round(d._dist)+'m'):((d._dist/1000).toFixed(1)+'km');
    var emojiSvg='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><text x="14" y="22" text-anchor="middle" font-size="22">'+ic+'</text></svg>');
    var mImg=new kakao.maps.MarkerImage(emojiSvg,new kakao.maps.Size(28,28),{offset:new kakao.maps.Point(14,28)});
    var mk=new kakao.maps.Marker({map:map,position:new kakao.maps.LatLng(d.y,d.x),title:d.place_name,image:mImg});
    markers[i]=mk;
    var iwHtml='<div style="padding:8px 14px;font-size:11px;color:#111;white-space:nowrap;border-radius:8px">'
      +'<div style="font-weight:800;font-size:12px">'+ic+' '+esc(d.place_name)+'</div>'
      +'<div style="font-size:10px;color:#718096;margin-top:3px">'+esc(d.road_address_name||d.address_name||'')+'</div>'
      +(d.phone?'<div style="font-size:10px;color:#4a5568;margin-top:2px">📞 '+esc(d.phone)+'</div>':'')
      +'<div style="font-size:9px;color:#0e7490;font-weight:600;margin-top:3px">📍 '+dist+'</div>';
    if(d._emgInfo){
      var e=d._emgInfo;
      iwHtml+='<div style="margin-top:4px;padding-top:4px;border-top:1px solid #e5e7eb;font-size:10px;line-height:1.6">';
      if(e.eryn)iwHtml+='<div style="font-weight:700;color:'+(e.eryn==='Y'?'#16a34a':'#dc2626')+'">'+(e.eryn==='Y'?'🟢 응급실 운영 중':'🔴 응급실 미운영')+'</div>';
      if(e.beds)iwHtml+='<div style="color:#dc2626;font-weight:700">🛏 가용병상: '+esc(e.beds)+'개</div>';
      if(e.icuBeds)iwHtml+='<div>🏥 중환자실: '+esc(e.icuBeds)+'개</div>';
      if(e.surgery)iwHtml+='<div>🔬 수술실: '+esc(e.surgery)+'개</div>';
      if(e.ct)iwHtml+='<div>CT: '+(e.ct==='Y'?'✅ 가능':'❌')+'</div>';
      if(e.mri)iwHtml+='<div>MRI: '+(e.mri==='Y'?'✅ 가능':'❌')+'</div>';
      iwHtml+='</div>';
    }
    iwHtml+='</div>';
    infoWins[i]={htmlContent:iwHtml, currentOv:null};
    (function(marker,iwIdx){
      kakao.maps.event.addListener(marker,'mouseover',function(){window._showMarkerOverlay(iwIdx);marker.setZIndex(50);});
      kakao.maps.event.addListener(marker,'click',function(){window._showMarkerOverlay(iwIdx);map.setCenter(marker.getPosition());map.setLevel(2);hl(iwIdx);});
    })(mk,i);
  });
}

/* list-item 이벤트 바인딩 — 새 배치 추가 시마다 호출 */
function _bindListItemEvents(panel){
  panel.querySelectorAll('.list-item:not([data-bound])').forEach(function(el){
    el.dataset.bound='1';
    var idx=parseInt(el.dataset.idx);
    el.addEventListener('click',function(e){
      if(e.target.closest('.fav-btn'))return;
      if(markers[idx]){map.setCenter(markers[idx].getPosition());map.setLevel(2);hl(idx);}
    });
    el.addEventListener('mouseenter',function(){this.classList.add('hl');if(infoWins[idx]&&markers[idx]){window._showMarkerOverlay(idx);markers[idx].setZIndex(100);}});
    el.addEventListener('mouseleave',function(){this.classList.remove('hl');});
  });
  panel.querySelectorAll('.fav-btn:not([data-bound])').forEach(function(btn){
    btn.dataset.bound='1';
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var idx=parseInt(this.dataset.favIdx);
      var d=_renderList[idx];if(!d)return;
      toggleFav(d.place_name,d);
      this.textContent=isFav(d.place_name)?'⭐':'☆';
      this.style.transform='scale(1.3)';
      var self=this;setTimeout(function(){self.style.transform='';},200);
      setTimeout(function(){render(_renderList);},300);
    });
  });
  panel.querySelectorAll('.print-btn:not([data-bound])').forEach(function(btn){
    btn.dataset.bound='1';
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var idx=parseInt(this.dataset.printIdx);
      var dd=_renderList[idx];if(!dd)return;
      _openMedPrintModal(dd);
    });
  });
  /* 🗺 카카오맵 길찾기 — 기준위치 → 해당 의료기관, 기본 브라우저로 열기 (사용자 요청 2026-06-18) */
  panel.querySelectorAll('.route-btn:not([data-bound])').forEach(function(btn){
    btn.dataset.bound='1';
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var idx=parseInt(this.dataset.routeIdx);
      var dd=_renderList[idx];if(!dd)return;
      _openKakaoRoute(dd);
    });
  });
}
/* 카카오맵 길찾기 URL 열기 — from(기준위치)→to(의료기관). 거리·소요시간은 카카오맵이 표시. */
function _openKakaoRoute(d){
  try{
    var sLat=(typeof schoolLat!=='undefined'&&schoolLat)||_preLat||0;
    var sLng=(typeof schoolLng!=='undefined'&&schoolLng)||_preLng||0;
    var sName=(typeof schoolName!=='undefined'&&schoolName)?schoolName:'기준위치';
    var url='https://map.kakao.com/link/from/'+encodeURIComponent(sName)+','+sLat+','+sLng
          +'/to/'+encodeURIComponent(d.place_name||'의료기관')+','+(d.y||'')+','+(d.x||'');
    if(window.electronAPI&&window.electronAPI.openExternal) window.electronAPI.openExternal(url);
    else window.open(url,'_blank');
  }catch(_){}
}

/* ── 인쇄 다이얼로그 헬퍼들 (2026-06-02) ── */
function _medPvCleanup(){
  ['medPrintArea','medRcPreview','medPvBackdrop','medPvBar','medPvCapA4','medPvCapRc','medPgSizeStyle'].forEach(function(id){ var el=document.getElementById(id); if(el)el.remove(); });
  document.body.classList.remove('printing');
  try{ window.removeEventListener('resize', _medPositionCards); }catch(_e){}
}
function _medInnerHtml(d){
  var name=esc(d.place_name||''),dept=esc(_medDeptText(d)),addr=esc(d.road_address_name||d.address_name||''),tel=esc(d.phone||'');
  var _distM=Number(d._dist);
  var _distTxt=(_distM>0&&_distM<9000000)?(_distM>=1000?(_distM/1000).toFixed(1).replace(/\.0$/,'')+'km':Math.round(_distM)+'m'):'';
  var _distLine=(schoolName&&_distTxt)?'<div class="mp-dist">('+esc(schoolName)+'에서 거리: '+_distTxt+')</div>':'';
  return '<div class="mp-nm">'+name+'</div>'+_distLine
    +(dept?'<div class="mp-row"><b>진료과</b> '+dept+'</div>':'')
    +(addr?'<div class="mp-row"><b>주소</b> '+addr+'</div>':'')
    +(tel?'<div class="mp-row"><b>전화</b> '+tel+'</div>':'');
}
function _buildMedRcPreview(d){
  var old=document.getElementById('medRcPreview'); if(old)old.remove();
  var rc=document.createElement('div'); rc.id='medRcPreview'; rc.className='mp-rc mp-card';
  rc.innerHTML=_medInnerHtml(d);
  document.body.appendChild(rc);
}
/* 두 미리보기 카드(A4·3인치)를 컨트롤 바 아래에 나란히 배치 + 화면에 맞게 축소(자기 자신만 scale). */
function _medPositionCards(){
  var a4=document.getElementById('medPrintArea'), rc=document.getElementById('medRcPreview'), bar=document.getElementById('medPvBar');
  if(!a4||!rc)return;
  a4.classList.add('mp-card'); rc.classList.add('mp-card');
  a4.style.transformOrigin='top left'; rc.style.transformOrigin='top left';
  a4.style.transform='none'; rc.style.transform='none';
  var barBottom = bar ? bar.getBoundingClientRect().bottom : 120;
  var topY = barBottom + 28, availH = Math.max(160, window.innerHeight - topY - 22);
  var a4W=a4.offsetWidth||794, a4H=a4.offsetHeight||1123;
  var rcW=rc.offsetWidth||272, rcH=rc.offsetHeight||220;
  var sA4=Math.min(availH/a4H, (window.innerWidth*0.46)/a4W, 0.7); if(!(sA4>0.08))sA4=0.32;
  var sRc=Math.min(availH/rcH, (window.innerWidth*0.30)/rcW, 1.1); if(!(sRc>0.08))sRc=0.8;
  var dA4=a4W*sA4, dRc=rcW*sRc, gap=30;
  var startX=Math.max(12, (window.innerWidth-(dA4+gap+dRc))/2);
  a4.style.left=startX+'px'; a4.style.top=topY+'px'; a4.style.transform='scale('+sA4.toFixed(3)+')';
  rc.style.left=(startX+dA4+gap)+'px'; rc.style.top=topY+'px'; rc.style.transform='scale('+sRc.toFixed(3)+')';
  var capA=document.getElementById('medPvCapA4'), capR=document.getElementById('medPvCapRc');
  if(capA){ capA.style.left=startX+'px'; capA.style.top=(topY-21)+'px'; }
  if(capR){ capR.style.left=(startX+dA4+gap)+'px'; capR.style.top=(topY-21)+'px'; }
}
/* 프린터 드롭다운 채우기 — 용지별 마지막 선택 기억. 우선순위: 마지막 선택 > 기본 > 첫 프린터. */
/* 영수증(열전사) 프린터 이름 판별 — 비어 있을 때 3인치↔A4 기본값이 안 섞이게. */
function _medIsRcPrinter(n){ n=(n||'').toLowerCase(); return /slk|ts-?200|\bpos\b|영수|receipt|thermal|bixolon|srp|80mm/.test(n); }
/* 프린터 드롭다운 — 공유 설정 키(settingsKey)에 저장/복원 → 의료기관·EMS·방문증 어디서 정하든 같은 프린터가 기본으로 뜸.
 * 우선순위: 저장된 마지막 출력 프린터 > (3인치=영수증형 / A4=영수증형 아닌 것 자동) > OS 기본. 선택 변경 시 즉시 저장. (2026-06-02) */
function _medFillPrinter(selId, settingsKey){
  var sel=document.getElementById(selId); if(!sel)return;
  var isRc=(settingsKey==='receipt_printer');
  sel.addEventListener('change', function(){ try{ electronAPI.settingsSet(settingsKey, sel.value||''); }catch(_e){} });
  var _populate=function(last){
    try{
      electronAPI.listPrinters().then(function(res){
        var list=(res&&Array.isArray(res.printers))?res.printers:(Array.isArray(res)?res:[]);
        if(!list.length)return;
        var defVal='';
        list.forEach(function(p){ var v=p.name||p.deviceName||''; var o=document.createElement('option'); o.value=v; o.textContent=(p.displayName||p.name||v)+(p.isDefault?' (기본)':''); sel.appendChild(o); if(p.isDefault)defVal=v; });
        var pick='';
        if(last){ for(var i=0;i<list.length;i++){ var lv=list[i].name||list[i].deviceName||''; if(lv===last){ pick=last; break; } } }
        if(!pick){
          if(isRc){   /* 3인치 = 영수증형 프린터 우선 */
            for(var k=0;k<list.length;k++){ var rn=list[k].name||list[k].deviceName||''; if(_medIsRcPrinter(rn)){ pick=rn; break; } }
            if(!pick)pick=defVal;
          } else {    /* A4 = 영수증형이 아닌 프린터(=일반 A4)로. OS 기본이 영수증형이면 건너뜀 */
            if(defVal && !_medIsRcPrinter(defVal)) pick=defVal;
            if(!pick){ for(var k2=0;k2<list.length;k2++){ var an=list[k2].name||list[k2].deviceName||''; if(an && !_medIsRcPrinter(an)){ pick=an; break; } } }
            if(!pick)pick=defVal;
          }
        }
        if(pick)sel.value=pick; else if(sel.options.length>1)sel.selectedIndex=1;
      }).catch(function(){});
    }catch(e){}
  };
  try{ electronAPI.settingsGet(settingsKey,'').then(function(r){ _populate((r&&r.value)||''); }).catch(function(){_populate('');}); }catch(e){ _populate(''); }
}
/* A4 인쇄 — 현재 창 인쇄(살아있는 약도 포함). @media print 가 #medPrintArea 만 노출. */
function _medPrintA4(){
  var dev=document.getElementById('medPvPrinterA4').value||undefined;
  try{ electronAPI.settingsSet('a4_printer', dev||''); }catch(_e){}   /* 공유 설정에 저장 */
  var _pg=document.getElementById('medPgSizeStyle'); if(_pg)_pg.remove();
  _pg=document.createElement('style'); _pg.id='medPgSizeStyle'; _pg.textContent='@page{size:A4;margin:0}'; document.head.appendChild(_pg);
  try{ console.log('[GP2][MEDPRINT] A4 인쇄 dev="'+(dev||'(기본)')+'"'); }catch(_e){}
  try{
    electronAPI.printCurrentWindow('A4', {marginType:'custom', top:0, bottom:0, left:0, right:0}, true, dev, false).then(function(res){
      try{ console.log('[GP2][MEDPRINT] A4결과='+JSON.stringify(res)); }catch(_e){}
      _medPvCleanup(); if(res&&!res.success&&!res.cancelled)_medNotice('인쇄 실패: '+(res.error||''), true);
    }).catch(function(e){ _medPvCleanup(); _medNotice('인쇄 오류: '+e.message, true); });
  }catch(e){ _medPvCleanup(); _medNotice('인쇄를 시작할 수 없습니다: '+e.message, true); }
}
/* 3인치 인쇄 — 방문증과 동일한 검증 경로(printWindowWithSize, 깨끗한 숨은 창 + @page 내장). Sewoo 정상 출력. */

  var dev=document.getElementById('medPvPrinterRc').value||undefined;

    +'@page{size:80mm '+rcH+'mm;margin:0}'
    +'*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}'
    +'html,body{margin:0;padding:0;background:#fff;color:#000}'
    +'body{width:80mm;box-sizing:border-box;padding:4mm;font-family:\'Malgun Gothic\',\'맑은 고딕\',sans-serif;font-size:12px;line-height:1.5;color:#000}'
    +'.mp-nm{font-weight:800;font-size:15px;margin-bottom:6px}'
    +'.mp-dist{color:#444;font-size:11px;font-weight:600;margin:0 0 7px}'

  try{ console.log('[GP2][MEDPRINT] 3인치 printWindowWithSize dev="'+(dev||'(기본)')+'" h='+rcH+'mm'); }catch(_e){}
  try{
    electronAPI.printWindowWithSize(rcHtml, {width:80000, height:rcH*1000}, {marginType:'custom', top:0, bottom:0, left:0, right:0}, undefined, true, dev, false).then(function(res){
      try{ console.log('[GP2][MEDPRINT] 3인치결과='+JSON.stringify(res)); }catch(_e){}
      _medPvCleanup(); if(res&&!res.success&&!res.cancelled)_medNotice('인쇄 실패: '+(res.error||''), true);
    }).catch(function(e){ try{ console.log('[GP2][MEDPRINT] 3인치reject='+e.message); }catch(_e){} _medPvCleanup(); _medNotice('인쇄 오류: '+e.message, true); });
  }catch(e){ _medPvCleanup(); _medNotice('인쇄를 시작할 수 없습니다: '+e.message, true); }
}
function _buildMedPrintArea(d, paper, wantMap, onReady){
  var old=document.getElementById('medPrintArea'); if(old)old.remove();
  var isA4=(paper==='a4');
  var name=esc(d.place_name||''),dept=esc(_medDeptText(d)),addr=esc(d.road_address_name||d.address_name||''),tel=esc(d.phone||'');
  /* 의료기관명 바로 아래에 "(기준지 학교명에서 거리: 521m)" — 거리는 기준위치(학교) 기준 d._dist(미터). (2026-06-01) */
  var _distM=Number(d._dist);
  var _distTxt=(_distM>0&&_distM<9000000)?(_distM>=1000?(_distM/1000).toFixed(1).replace(/\.0$/,'')+'km':Math.round(_distM)+'m'):'';
  var _distLine=(schoolName&&_distTxt)?'<div class="mp-dist">('+esc(schoolName)+'에서 거리: '+_distTxt+')</div>':'';
  var pa=document.createElement('div'); pa.id='medPrintArea'; pa.className=isA4?'mp-a4':'mp-rc';
  var inner='<div class="mp-nm">'+name+'</div>'+_distLine
    +(dept?'<div class="mp-row"><b>진료과</b> '+dept+'</div>':'')
    +(addr?'<div class="mp-row"><b>주소</b> '+addr+'</div>':'')
    +(tel?'<div class="mp-row"><b>전화</b> '+tel+'</div>':'');
  if(wantMap){ inner+='<div id="medPrintMap"></div><div class="mp-scale"><span>축척</span><span class="mp-scbar" id="medScBar"></span><span id="medScLabel">30m</span></div>'; }
  pa.innerHTML=inner;
  document.body.appendChild(pa);
  document.body.classList.add('printing');
  if(!wantMap){ onReady(); return; }
  try{
    var lat=Number(d.y),lng=Number(d.x);
    var dest=new kakao.maps.LatLng(lat,lng);
    var hasSchool=!!(schoolLat&&schoolLng);
    var mp=new kakao.maps.Map(document.getElementById('medPrintMap'),{center:dest,level:3,draggable:false,scrollwheel:false});
    /* 목적지(병원) 마커 + 라벨 */
    new kakao.maps.Marker({map:mp,position:dest});
    new kakao.maps.CustomOverlay({map:mp,position:dest,yAnchor:2.1,content:'<div style="padding:1px 5px;font-size:10px;font-weight:700;color:#b91c1c;background:#fff;border:1px solid #b91c1c;border-radius:4px;white-space:nowrap">병원</div>'});
    if(hasSchool){
      var sch=new kakao.maps.LatLng(schoolLat,schoolLng);
      new kakao.maps.Marker({map:mp,position:sch});
      new kakao.maps.CustomOverlay({map:mp,position:sch,yAnchor:2.1,content:'<div style="padding:1px 5px;font-size:10px;font-weight:700;color:#0e7490;background:#fff;border:1px solid #0e7490;border-radius:4px;white-space:nowrap">기준지</div>'});
      /* 기준지+목적지 둘 다 보이는 최대 확대로 자동 맞춤(가장자리 패딩). */
      var bounds=new kakao.maps.LatLngBounds(); bounds.extend(dest); bounds.extend(sch);
      mp.setBounds(bounds, 34, 30, 42, 30);
    }
    /* 동적 축척 — 현재(확정된) 줌에서 m/px 측정 후 둥근 거리 막대로 표시. */
    function drawScale(){try{
      var proj=mp.getProjection();
      var cen=mp.getCenter(), clat=cen.getLat(), clng=cen.getLng();
      var dLng=100/(111320*Math.cos(clat*Math.PI/180));   /* 100m 동쪽 = 경도 변화량 */
      var pA=proj.containerPointFromCoords(new kakao.maps.LatLng(clat,clng));
      var pB=proj.containerPointFromCoords(new kakao.maps.LatLng(clat,clng+dLng));
      var pxPer100=Math.abs(pB.x-pA.x); if(!(pxPer100>0))return;
      var mPerPx=100/pxPer100, targetPx=84, rawM=mPerPx*targetPx;
      var steps=[10,20,30,50,100,200,300,500,1000,2000,3000,5000,10000,20000,50000];
      var step=steps[0]; for(var i=0;i<steps.length;i++){ if(steps[i]<=rawM) step=steps[i]; }
      var bar=document.getElementById('medScBar'); if(bar)bar.style.width=Math.round(step/mPerPx)+'px';
      var lb=document.getElementById('medScLabel'); if(lb)lb.textContent=(step>=1000?(step/1000)+'km':step+'m');
    }catch(e){}}
    var fired=false; var go=function(){ if(fired)return; fired=true; drawScale(); onReady(); };
    kakao.maps.event.addListener(mp,'tilesloaded',function(){ setTimeout(go,250); });
    setTimeout(go,3500);   /* 타일 안 뜨면 폴백 — 텍스트는 무조건 인쇄 */
  }catch(e){ onReady(); }
}

  panel.querySelectorAll('.list-item').forEach(function(el){
    var idx=parseInt(el.dataset.idx);
    el.addEventListener('click',function(e){
      if(e.target.closest('.fav-btn'))return;
      if(markers[idx]){map.setCenter(markers[idx].getPosition());map.setLevel(2);hl(idx);}
    });
    el.addEventListener('mouseenter',function(){this.classList.add('hl');if(infoWins[idx]&&markers[idx]){window._showMarkerOverlay(idx);markers[idx].setZIndex(100);}});
    el.addEventListener('mouseleave',function(){this.classList.remove('hl');});
  });
  /* 즐겨찾기 별표 클릭 */
  panel.querySelectorAll('.fav-btn').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.stopPropagation();
      var idx=parseInt(this.dataset.favIdx);
      var d=_renderList[idx];if(!d)return;
      toggleFav(d.place_name,d);
      this.textContent=isFav(d.place_name)?'⭐':'☆';
      this.style.transform='scale(1.3)';
      var self=this;setTimeout(function(){self.style.transform='';},200);
      /* 재정렬 */
      setTimeout(function(){render(_renderList);},300);
    });
  });
}

function hl(idx){
  document.querySelectorAll('.list-item').forEach(function(e){e.classList.remove('hl');});
  var items=document.querySelectorAll('.list-item');
  if(items[idx]){items[idx].classList.add('hl');items[idx].scrollIntoView({block:'nearest'});}
}

/* 진료과 — 심평원 dgsbjtCd(진료과목) 코드 매핑
 * 주의: clCd(기관 분류)와 다름. clCd=01 은 "상급종합병원" 이므로 절대 사용하지 말 것. */
var DEPT_CD={'내과':'01','신경과':'02','정신건강의학과':'03','외과':'04','정형외과':'05','신경외과':'06',
  '성형외과':'08','마취통증의학과':'09','산부인과':'10','소아청소년과':'11','안과':'12','이비인후과':'13',
  '피부과':'14','비뇨의학과':'15','재활의학과':'21','가정의학과':'23','응급의학과':'24','치과':'49'};
/* 진료과별 아이콘 */
var DEPT_IC={'내과':'🫀','신경과':'🧠','정신건강의학과':'🧠','외과':'🔪','정형외과':'🦴','신경외과':'🧠',
  '성형외과':'✨','마취통증의학과':'💉','산부인과':'🤰','소아청소년과':'👶','안과':'👁','이비인후과':'👂',
  '피부과':'🧴','비뇨의학과':'🫘','재활의학과':'🏋️','가정의학과':'👨‍⚕️','응급의학과':'🚨','치과':'🦷'};
var _curDept='';

document.getElementById('deptSel').addEventListener('click',function(){closeAllInfoWins();});
document.getElementById('deptSel').addEventListener('change',function(){
  closeAllInfoWins();
  _curDept=this.value;
  if(!this.value){doSearch();return;}
  clearAll();
  var dept=this.value;
  document.getElementById('listPanel').innerHTML='<div class="loading">⏳ '+esc(dept)+' 검색 중...</div>';

  /* 심평원 API — dgsbjtCd + 학교 좌표·반경 기반 (API 가 거리순 정렬 반환)
   * 1페이지 numOfRows=100 단일 호출 + 메모리 캐시 + 6초 타임아웃 */
  if(hiraKey&&window.electronAPI&&window.electronAPI.externalFetchMedFacilities&&DEPT_CD[dept]){
    var cacheKey=dept+'@'+schoolLat.toFixed(3)+','+schoolLng.toFixed(3);
    var cached=_deptCache[cacheKey];
    if(cached){render(cached);return;}
    var timedOut=false;
    var tmo=setTimeout(function(){timedOut=true;searchDeptKakao(dept);},6000);
    window.electronAPI.externalFetchMedFacilities(hiraKey,{
      type:'hospital',
      numOfRows:50,
      pageNo:1,
      dgsbjtCd:DEPT_CD[dept],
      xPos:schoolLng,
      yPos:schoolLat,
      radius:30000
    }).then(function(res){
      if(timedOut)return;
      clearTimeout(tmo);
      if(!res||!res.success||!res.data||!res.data.length){searchDeptKakao(dept);return;}
      var seen={};
      /* 전문과 — HIRA dgsbjtCd 가 비엄격(보유 진료과 한 개만 매칭해도 반환)이라
       * 정형외과/내과 위주 병원이 피부과 검색에 끼는 현상 방지: 병원명에 과명 포함된 경우만 통과.
       * 1차 진료(내과·외과·가정의학과·소아청소년과·응급의학과)는 포괄성 유지 위해 제외. */
      var STRICT_DEPTS=['피부과','비뇨의학과','재활의학과','산부인과','신경과','정신건강의학과','치과','이비인후과','안과','정형외과','신경외과','성형외과','마취통증의학과'];
      var _strict=STRICT_DEPTS.indexOf(dept)!==-1;
      var list=res.data.filter(function(d){
        var key=d.ykiho||d.yadmNm;
        if(seen[key])return false;
        seen[key]=true;
        var nm=(d.yadmNm||'').toLowerCase();
        for(var i=0;i<EXCLUDE.length;i++){if(nm.indexOf(EXCLUDE[i])!==-1)return false;}
        if(_strict&&nm.indexOf(dept)===-1)return false;
        return true;
      });
      list.forEach(function(d){
        var x=parseFloat(d.XPos||d.wgs84Lon||0),y=parseFloat(d.YPos||d.wgs84Lat||0);
        d._dist=(x&&y)?distKm(schoolLat,schoolLng,y,x)*1000:9999000;
        d.place_name=d.yadmNm||'';d.road_address_name=d.addr||'';d.phone=d.telno||'';
        d.category_name=dept+(d.clCdNm?' > '+d.clCdNm:' > 병원');
        d.y=String(y);d.x=String(x);
      });
      list=list.filter(function(d){return d._dist<=30000&&d._dist<9999000;});
      list.sort(function(a,b){return a._dist-b._dist;});
      if(!list.length){searchDeptKakao(dept);return;}
      _deptCache[cacheKey]=list;
      render(list);
    }).catch(function(err){
      if(timedOut)return;
      clearTimeout(tmo);
      console.warn('[MedFac] HIRA 진료과 검색 실패:',err);
      searchDeptKakao(dept);
    });
  } else {
    searchDeptKakao(dept);
  }
});

/* 진료과 검색 결과 메모리 캐시 — (진료과명 + 학교좌표 키) */
var _deptCache={};

function searchDeptKakao(dept){
  var center=map.getCenter();
  /* 밀집 지역 대응 — 9개 좌표에서 분산 검색 */
  var off=0.03;
  var pts=[
    {x:center.getLng(),y:center.getLat()},
    {x:center.getLng()+off,y:center.getLat()},
    {x:center.getLng()-off,y:center.getLat()},
    {x:center.getLng(),y:center.getLat()+off*0.8},
    {x:center.getLng(),y:center.getLat()-off*0.8},
    {x:center.getLng()+off,y:center.getLat()+off*0.8},
    {x:center.getLng()-off,y:center.getLat()+off*0.8},
    {x:center.getLng()+off,y:center.getLat()-off*0.8},
    {x:center.getLng()-off,y:center.getLat()-off*0.8}
  ];
  var allData=[],done=0,total=pts.length*3;
  var deptLc=dept.toLowerCase();
  pts.forEach(function(pt){
    [1,2,3].forEach(function(pg){
      apiKw(dept,pt.x,pt.y,5000,pg).then(function(r){
        done++;
        if(r&&r.success&&r.data)allData=allData.concat(r.data);
        if(done>=total){
          var seen={};
          /* 전문과는 병원명(place_name)에 직접 진료과명이 포함될 때만 통과 — HIRA 와 동일 정책 */
          var STRICT_DEPTS_KW=['피부과','비뇨의학과','재활의학과','산부인과','신경과','정신건강의학과','치과','이비인후과','안과','정형외과','신경외과','성형외과','마취통증의학과'];
          var _strictKw=STRICT_DEPTS_KW.indexOf(dept)!==-1;
          var list=allData.filter(function(d){
            if(seen[d.id])return false;seen[d.id]=true;
            var nm=(d.place_name||'').toLowerCase();
            var cn=(d.category_name||'').toLowerCase();
            /* 제외 키워드 (동물/수의/산후/요양) */
            for(var i=0;i<EXCLUDE.length;i++){if(nm.indexOf(EXCLUDE[i])!==-1||cn.indexOf(EXCLUDE[i])!==-1)return false;}
            /* 의료기관 분류 체크 */
            var isHospital=cn.indexOf('병원')!==-1||cn.indexOf('의원')!==-1||cn.indexOf('의료')!==-1||cn.indexOf('클리닉')!==-1;
            if(!isHospital)return false;
            /* 진료과 매칭 — 전문과는 병원명에 과명 포함 시만 통과(엄격).
             * 1차 진료(내과·외과·가정의학과·소아청소년과·응급의학과)는 카테고리 매칭 허용(포괄). */
            if(_strictKw)return nm.indexOf(deptLc)!==-1;
            return nm.indexOf(deptLc)!==-1||cn.indexOf(deptLc)!==-1;
          });
          list.forEach(function(d){d._dist=distKm(schoolLat,schoolLng,parseFloat(d.y),parseFloat(d.x))*1000;});
          list=list.filter(function(d){return d._dist<=30000;});
          list.sort(function(a,b){return a._dist-b._dist;});
          render(list);
        }
      });
    });
  });
}
/* ═══ 주소 입력 — 자동완성 드롭다운 + Enter 검색 ═══ */
(function(){
  var addrInput=document.getElementById('addrInput');
  var addrDrop=document.getElementById('addrDrop');
  if(!addrInput)return;
  addrInput.value=schoolAddr||schoolQuery||'';
  var _addrT=null;

  function moveToAddr(lat,lng,label){
    schoolLat=lat;schoolLng=lng;
    if(map){map.setCenter(new kakao.maps.LatLng(lat,lng));map.setLevel(5);}
    if(schoolMk)schoolMk.setMap(null);
    var img=new kakao.maps.MarkerImage('https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',new kakao.maps.Size(24,35));
    schoolMk=new kakao.maps.Marker({map:map,position:new kakao.maps.LatLng(lat,lng),image:img,zIndex:100});
    document.getElementById('schoolAddrDisplay').textContent='📍 '+esc(label);
    doSearch();
  }

  /* 자동완성 — 입력 시 도로명 주소 후보 */
  addrInput.addEventListener('input',function(){
    var q=this.value.trim();
    if(q.length<2){addrDrop.style.display='none';return;}
    clearTimeout(_addrT);
    _addrT=setTimeout(function(){
      if(!window.electronAPI||!window.electronAPI.kakaoAddressSearch)return;
      window.electronAPI.kakaoAddressSearch(q,window._kakaoRestKey).then(function(r){
        if(!r||!r.success||!r.data||!r.data.length){
          /* 주소 검색 실패 시 키워드 검색 폴백 */
          apiKw(q).then(function(r2){
            if(!r2||!r2.success||!r2.data||!r2.data.length){addrDrop.style.display='none';return;}
            var h='';
            r2.data.slice(0,5).forEach(function(d){
              h+='<div class="ac-item" data-lat="'+d.y+'" data-lng="'+d.x+'" data-label="'+esc(d.road_address_name||d.address_name||d.place_name)+'">';
              h+='<span class="ac-icon">📍</span><div style="display:inline-block;vertical-align:middle"><div class="ac-name">'+esc(d.place_name||d.address_name)+'</div>';
              h+='<div class="ac-addr">'+esc(d.road_address_name||d.address_name||'')+'</div></div></div>';
            });
            addrDrop.innerHTML=h;addrDrop.style.display='block';
            bindAddrItems();
          });
          return;
        }
        var h='';
        r.data.forEach(function(d){
          var addr=d.road_address?d.road_address.address_name:(d.address?d.address.address_name:'');
          h+='<div class="ac-item" data-lat="'+d.y+'" data-lng="'+d.x+'" data-label="'+esc(addr)+'">';
          h+='<span class="ac-icon">🏠</span><div style="display:inline-block;vertical-align:middle"><div class="ac-name">'+esc(addr)+'</div>';
          if(d.road_address&&d.road_address.building_name)h+='<div class="ac-addr">'+esc(d.road_address.building_name)+'</div>';
          h+='</div></div>';
        });
        addrDrop.innerHTML=h;addrDrop.style.display='block';
        bindAddrItems();
      });
    },300);
  });

  function bindAddrItems(){
    addrDrop.querySelectorAll('.ac-item').forEach(function(el){
      el.addEventListener('click',function(){
        addrInput.value=this.dataset.label;
        addrDrop.style.display='none';
        moveToAddr(parseFloat(this.dataset.lat),parseFloat(this.dataset.lng),this.dataset.label);
      });
    });
  }

  addrInput.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    addrDrop.style.display='none';
    var q=this.value.trim();if(!q)return;
    apiKw(q).then(function(r){
      if(r&&r.success&&r.data&&r.data.length){
        var d=r.data[0];
        moveToAddr(parseFloat(d.y),parseFloat(d.x),d.road_address_name||d.address_name||q);
        addrInput.value=d.road_address_name||d.address_name||q;
      }
    });
  });
  addrInput.addEventListener('blur',function(){setTimeout(function(){addrDrop.style.display='none';},200);});
})();
</script>
