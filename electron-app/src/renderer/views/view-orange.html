  <style>
    /* 오렌지팜 외부 사이트 이동 CTA 버튼 — hover 애니메이션.
     * 버튼들이 absolute + translate 로 중앙/세로정렬 되어 있어 transform 을 덮어쓰면 위치가 튐.
     * 그래서 transform 은 건드리지 않고 box-shadow / filter / glow 로만 강조. */
    .orange-cta-btn{transition:box-shadow .22s ease,filter .22s ease;will-change:filter,box-shadow}
    .orange-cta-btn:hover{
      box-shadow:0 12px 26px rgba(234,88,12,0.62),0 0 0 4px rgba(234,88,12,0.20)!important;
      filter:brightness(1.08) saturate(1.10);
      animation:orangeCtaPulse 1.6s ease-in-out infinite;
    }
    .orange-cta-btn:active{box-shadow:0 4px 10px rgba(234,88,12,0.45)!important;filter:brightness(0.98)}
    @keyframes orangeCtaPulse{
      0%,100%{box-shadow:0 12px 26px rgba(234,88,12,0.62),0 0 0 4px rgba(234,88,12,0.20)}
      50%{box-shadow:0 14px 30px rgba(234,88,12,0.75),0 0 0 7px rgba(234,88,12,0.10)}
    }
  </style>
