  <div id="view-magic" class="view">
    <div style="position:relative">
      <div style="display:flex;align-items:flex-end;gap:0;margin-bottom:0;padding-left:0">
        <div class="magic-index-tab active" id="magicSubTab3" data-magic-sub="planner">플래너</div>
        <div class="magic-index-tab" id="magicSubTabSurvey" data-magic-sub="survey">설문 리스트 &amp; 에디터</div>
        <div class="magic-index-tab" id="magicSubTabTraining" data-magic-sub="training">연수 &amp; 교육 기록/등록부</div>
        <!-- [BACKUP] 가정통신문 마법사 탭 — 추후 공개 예정 -->
        <!-- <div class="magic-index-tab" id="magicSubTabNewsletter" onclick="_magicSwitchSub('newsletter',this)">가정통신문 마법사</div> -->
        <!-- 체격검사마법사 임시 제거 -->
        <div style="flex:1"></div>
      </div>
      <div class="magic-chart-body">
        <!-- 플래너 -->
        <div id="magicSubPlanner2" class="magic-sub-content active" style="padding:12px;overflow:auto;height:calc(100vh - 180px)">
          <!-- 상단: 구글 캘린더 임베드 + 날짜 네비 -->
          <div class="cc" id="gp2CalendarWrap" style="padding:10px 14px;margin-bottom:0;overflow:visible">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
              <span style="font-size:13px;font-weight:700;color:var(--t1)">📆 Google Calendar</span>
              <span id="gp2GcalStatus" style="font-size:11px;color:var(--t3)"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:4px;vertical-align:middle"></span>미연결</span>
              <button class="btn btn-outline btn-sm" id="gp2ConnectCalendarBtn">캘린더 연결</button>
              <div style="flex:1"></div>
              <!-- 경과율 -->
              <div style="display:flex;align-items:center;gap:8px">
                <!-- 올해 경과율 -->
                <div style="display:flex;align-items:center;gap:4px;background:var(--bg2);padding:4px 8px;border-radius:6px" title="올해 경과율">
                  <span style="font-size:9px;font-weight:700;color:var(--t2)" id="gp2YearLabel"></span>
                  <div style="width:60px;height:12px;background:var(--bg);border-radius:3px;overflow:hidden;position:relative"><div id="gp2YearBar" style="background:linear-gradient(90deg,#06b6d4,#0891b2);height:100%;border-radius:3px"></div><span id="gp2YearPct" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:7px;font-weight:800;color:var(--t1)"></span></div>
                </div>
              </div>
              <button class="btn btn-primary btn-sm" id="gp2GoTodayBtn">오늘</button>
            </div>
            <!-- 달력 그리드 -->
            <div id="gp2CalendarGrid"></div>
            <div id="gp2EventTags" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"></div>
          </div>

          <!-- 리사이즈 바-->
          <div id="gp2ResizeBar" style="height:15px;cursor:grab;margin:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:4px;transition:background 0.15s"><div style="width:50px;height:4px;background:var(--bdr);border-radius:2px"></div></div>
          <div style="font-size:9px;color:var(--t3);text-align:center;margin-bottom:6px">위젯 오른쪽 아래 모서리를 클릭하여 드래그로 크기 조정, 위젯 왼쪽 위 ⠿ 블록을 클릭하여 위치 조정이 가능합니다.</div>

          <!-- 하단: 위젯 영역 -->
          <div id="gp2BottomArea" style="display:grid;grid-template-columns:repeat(6,1fr);grid-auto-flow:dense;grid-auto-rows:minmax(60px,auto);gap:10px;min-height:300px;overflow:hidden;padding:8px;border:2px dashed transparent;border-radius:10px;transition:border-color 0.2s;align-items:start;max-width:100%">
            <div id="gp2DropHint" style="width:100%;text-align:center;padding:40px 20px;color:var(--t3);font-size:12px">📦 위젯 보관함에서 원하는 위젯을 클릭하여 여기에 추가하세요</div>
          </div>
          <!-- 하단 리사이즈 바 (위젯 영역 높이 조절) -->
          <div id="gp2ResizeBarBottom" style="height:15px;cursor:grab;margin:0;display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:4px;transition:background 0.15s"><div style="width:50px;height:4px;background:var(--bdr);border-radius:2px"></div></div>
          <!-- 날짜 클릭 팝업 (숨김) -->
          <div id="gp2DayPopup" style="display:none;position:fixed;z-index:11000;width:360px;max-height:80vh;background:linear-gradient(145deg,#2a2d35 0%,#1e2028 50%,#16181d 100%);border:0.5px solid rgba(255,255,255,0.1);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.4),0 0 1px rgba(255,255,255,0.08),inset 0 1px 0 rgba(255,255,255,0.05);overflow:hidden">
            <div style="background:linear-gradient(135deg,rgba(6,182,212,0.10),rgba(139,92,246,0.06));padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr)">
              <span id="gp2PopupTitle" style="font-size:13px;font-weight:800;color:var(--t1)"></span>
            </div>
            <div style="max-height:calc(80vh - 44px);overflow-y:auto;padding:12px">
              <!-- 일정 -->
              <div id="gp2PopupEvents" style="margin-bottom:8px"></div>
              <!-- 할 일 -->
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <span style="font-size:11px;font-weight:700;color:var(--t1)">✅ 할 일</span>
                <button class="btn btn-outline btn-sm" id="gp2AddTodoBtn" style="font-size:9px;padding:2px 8px">+ 추가</button>
              </div>
              <div id="gp2TodoList" style="margin-bottom:6px"></div>
              <!-- 캘린더 색상 -->
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
                <span style="font-size:9px;color:var(--t3)">캘린더 색상</span>
                <div id="gp2ColorPalette" style="display:flex;gap:3px"></div>
              </div>
              <!-- 메모 -->
              <div style="font-size:11px;font-weight:700;color:var(--t1);margin-bottom:4px">📝 메모</div>
              <textarea id="gp2Memo" style="width:100%;min-height:80px;font-size:11px;line-height:1.6;border:1px solid var(--bdrl);border-radius:6px;padding:6px;resize:vertical;background:var(--bg);color:var(--t1);font-family:var(--f)" placeholder="메모..."></textarea>
              <!-- 이월 -->
              <div id="gp2CarryOver" style="margin-top:8px"></div>
            </div>
          </div>
        </div>
        <!-- [BACKUP] 건강설문 프래그먼트 — 추후 재삽입 가능 -->
        <div id="magicSubSurveyFragmentHost" data-fragment="src/renderer/views/magic-sub-survey.html"></div>
        <!-- [BACKUP] 가정통신문 마법사 프래그먼트 — 추후 공개 예정 -->
        <!-- <div id="magicSubNewsletterFragmentHost" data-fragment="src/renderer/views/magic-sub-newsletter.html"></div> -->
        <!-- 연수 (매직 스테이션 하위) -->
        <div id="magicSubTraining" class="magic-sub-content" style="padding:12px 16px">
          <div id="dailyCat-training" style="display:block">
            <div style="padding:8px 12px 6px;border-bottom:1px solid var(--bdr)">
              <div class="tr-sub-tab-wrap">
                <button class="tr-sub-tab active" id="trSubTabReg" data-tr-sub="reg">연수/교육 등록부</button>
                <button class="tr-sub-tab" id="trSubTabStatus" data-tr-sub="status">연수 이수 현황</button>
              </div>
            </div>
            <div id="trSubReg" style="display:block"><div id="trainingArea"></div></div>
            <div id="trSubStatus" style="display:none"><div id="trainingStatusArea"></div></div>
          </div>
        </div>
        <!-- [BACKUP] 체격검사 마법사 프래그먼트 — 추후 재삽입 가능 -->
        <!-- <div id="magicSubPhysicalFragmentHost" data-fragment="src/renderer/views/magic-sub-physical.html"></div> -->
      </div>
    </div>

  </div>
