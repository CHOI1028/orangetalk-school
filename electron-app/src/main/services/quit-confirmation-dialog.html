<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>오렌지톡 종료</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%;height:100%;margin:0; }
    body { background:var(--card,#fff);color:var(--t1,#192337);font-family:var(--quit-font,'Malgun Gothic',sans-serif);font-size:13px; }
    .quit-card { height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--bdr,#d5dfe5);border-radius:16px; }
    .quit-header { display:flex;align-items:center;gap:9px;min-height:64px;padding:14px 20px;background:var(--school-card-heading-bg,#f2f8f8);border-bottom:1px solid var(--bdr,#d5dfe5); }
    .quit-brand { color:#ed7919;font-size:17px;font-weight:800;letter-spacing:-.5px; }
    .quit-edition { color:var(--t2,#637487);font-size:11px;border-left:1px solid var(--bdr,#d5dfe5);padding-left:9px; }
    button { font:inherit;cursor:pointer;transition:background .15s,border-color .15s; }
    .quit-close { margin-left:auto;flex:none;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--bdr,#d5dfe5);border-radius:8px;color:var(--t2,#637487);background:var(--card,#fff); }
    .quit-close svg { width:14px;height:14px; }
    .quit-body { flex:1;min-height:0;overflow:auto;padding:22px 24px 16px; }
    .quit-heading { display:flex;align-items:center;gap:12px; }
    .quit-symbol { width:42px;height:42px;flex:none;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--cyan,#07849c) 20%,var(--bdr,#d5dfe5));border-radius:12px;background:color-mix(in srgb,var(--cyan,#07849c) 8%,var(--card,#fff));color:var(--cyan,#07849c); }
    .quit-symbol svg { width:22px;height:22px; }
    h1 { margin:0;font-size:20px;line-height:1.4;font-weight:750;letter-spacing:-.6px;overflow-wrap:anywhere; }
    .quit-description { margin:16px 0 0;color:var(--t2,#637487);line-height:1.75;word-break:keep-all;overflow-wrap:anywhere; }
    .quit-note { margin:9px 0 0;color:var(--t2,#637487);font-size:12px;line-height:1.6;word-break:keep-all; }
    .quit-actions { display:flex;justify-content:flex-end;gap:8px;flex:none;padding:16px 24px 20px;border-top:1px solid var(--bdr,#d5dfe5);background:var(--card,#fff); }
    .quit-button { min-height:38px;min-width:106px;padding:8px 16px;border:1px solid var(--bdr,#d5dfe5);border-radius:8px;background:var(--card,#fff);color:var(--t1,#192337);font-weight:700; }
    .quit-button-primary { background:var(--school-action-primary,var(--cyan,#07849c));border-color:var(--school-action-primary,var(--cyan,#07849c));color:#fff; }
    .quit-button:not(.quit-button-primary):hover,.quit-close:hover { background:var(--bg2,#eff3f6); }
    .quit-button-primary:hover { background:color-mix(in srgb,var(--school-action-primary,var(--cyan,#07849c)) 88%,#000); }
    button:focus-visible { outline:2px solid var(--cyan,#07849c);outline-offset:3px; }
    button:disabled { cursor:default;opacity:.65; }
    @media(max-width:350px) { .quit-header{padding:10px 14px}.quit-body{padding:16px}.quit-actions{padding:12px 16px}.quit-button{flex:1;min-width:0;padding:8px}h1{font-size:18px}.quit-edition{display:none} }
    @media(max-height:290px) { .quit-header{min-height:48px;padding-top:8px;padding-bottom:8px}.quit-body{padding-top:12px;padding-bottom:12px}.quit-description{margin-top:10px}.quit-actions{padding-top:10px;padding-bottom:12px}.quit-note{display:none} }
    @media(prefers-reduced-motion:reduce) { button{transition:none} }
  </style>
</head>
<body>
  <section class="quit-card" role="dialog" aria-modal="true" aria-labelledby="quitTitle" aria-describedby="quitDescription">
    <header class="quit-header">
      <span class="quit-brand">오렌지톡</span><span class="quit-edition">학교용</span>
      <button id="quitClose" class="quit-close" type="button" aria-label="종료 취소" title="계속 사용">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
      </button>
    </header>
    <main class="quit-body">
      <div class="quit-heading">
        <span class="quit-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v9M6.4 6.8a8 8 0 1 0 11.2 0"/></svg></span>
        <h1 id="quitTitle">오렌지톡을 종료할까요?</h1>
      </div>
      <p class="quit-description" id="quitDescription">진행 중인 입력과 저장 상태를 확인한 뒤<br>종료해 주세요.</p>
      <p class="quit-note">취소하면 현재 화면에서 계속 작업할 수 있습니다.</p>
    </main>
    <footer class="quit-actions">
      <button id="quitKeep" class="quit-button" type="button" autofocus>계속 사용</button>
      <button id="quitLeave" class="quit-button quit-button-primary" type="button">종료하기</button>
    </footer>
  </section>
</body>
</html>
