<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>오렌지톡 종료</title>
  <style>
    * { box-sizing:border-box; }
    html,body { width:100%;height:100%;margin:0; }
    body { background:var(--card,#fff);color:var(--t1,#192337);font-family:var(--quit-font,'Malgun Gothic',sans-serif);font-size:12px; }
    .quit-card { height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--bdr,#d5dfe5);border-radius:14px; }
    .quit-header { display:flex;align-items:center;gap:9px;flex:none;min-height:48px;padding:9px 16px 5px;background:var(--card,#fff); }
    .quit-logo { display:block;flex:none;width:30px;height:30px;object-fit:contain; }
    button { font:inherit;cursor:pointer;transition:background .15s,border-color .15s; }
    .quit-close { margin-left:auto;flex:none;width:26px;height:26px;display:grid;place-items:center;border:1px solid transparent;border-radius:7px;color:var(--t2,#637487);background:transparent; }
    .quit-close svg { width:13px;height:13px; }
    .quit-body { flex:1;min-height:0;overflow:auto;padding:10px 18px 12px; }
    h1 { margin:0;font-size:17px;line-height:1.45;font-weight:750;letter-spacing:-.5px;word-break:keep-all;overflow-wrap:anywhere; }
    .quit-description { margin:9px 0 0;color:var(--t2,#637487);font-size:12px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere; }
    .quit-description span { display:block; }
    .quit-actions { display:flex;gap:8px;flex:none;padding:11px 16px 14px;border-top:1px solid color-mix(in srgb,var(--bdr,#d5dfe5) 60%,var(--card,#fff));background:color-mix(in srgb,#afc3d0 6%,var(--card,#fff)); }
    .quit-button { flex:1;min-width:0;min-height:36px;padding:7px 10px;border:1px solid var(--bdr,#d5dfe5);border-radius:9px;background:var(--card,#fff);color:var(--t1,#192337);font-weight:700; }
    .quit-button-primary { background:var(--school-action-primary,var(--cyan,#07849c));border-color:var(--school-action-primary,var(--cyan,#07849c));color:#fff; }
    .quit-button:not(.quit-button-primary):hover,.quit-close:hover { background:var(--bg2,#eff3f6); }
    .quit-button-primary:hover { background:color-mix(in srgb,var(--school-action-primary,var(--cyan,#07849c)) 88%,#000); }
    button:focus-visible { outline:2px solid var(--cyan,#07849c);outline-offset:2px; }
    button:disabled { cursor:default;opacity:.65; }
    @media(max-width:290px) { .quit-header{padding-left:12px;padding-right:12px}.quit-body{padding-left:13px;padding-right:13px}.quit-actions{padding-left:12px;padding-right:12px}h1{font-size:16px}.quit-description{font-size:11px} }
    @media(max-height:210px) { .quit-header{min-height:40px;padding-top:5px}.quit-logo{width:26px;height:26px}.quit-body{padding-top:6px;padding-bottom:8px}.quit-actions{padding-top:8px;padding-bottom:10px}.quit-description{margin-top:6px} }
    @media(prefers-reduced-motion:reduce) { button{transition:none} }
  </style>
</head>
