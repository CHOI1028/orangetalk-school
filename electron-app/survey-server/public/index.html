<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>오렌지톡 설문</title><link rel="stylesheet" href="/s/assets/survey.css"><script defer src="/s/assets/model.js"></script><script defer src="/s/assets/respond.js"></script></head>
<body><main><header><span class="brand">오렌지톡 · 학교 설문</span><h1 id="title">설문을 불러오는 중입니다</h1><p id="description"></p></header><p id="message" role="status" aria-live="polite"></p><form id="survey" hidden><label id="languageLabel">응답 언어 / Language<select id="language"></select></label><section id="identity"><h2>학생 정보</h2><p>응답 확인을 위해 학생 정보를 입력해 주세요.</p><label>학생 이름<input id="name" required maxlength="100" autocomplete="off"></label><div class="identity-grid"><label>학년<input id="grade" type="number" min="1" max="999" required></label><label>반<input id="cls" type="number" min="1" max="999" required></label><label>번호<input id="num" type="number" min="1" max="999" required></label></div></section><div id="questions"></div><footer><span id="progress"></span><div><button type="button" id="back" class="secondary">이전</button><button type="submit" id="next">다음</button></div></footer></form></main></body></html>
